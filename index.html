  gexAdd('en', 'B1', 'b1-perfect-continuous', ['Present perfect continuous', 'have/has been + verb-ing: an action that started in the past and is still going on, or has just stopped with a visible result. Focus on duration: I have been waiting for an hour. Why are you wet? Have you been running?'],
    ['Present Perfect Continuous', 'have/has been + глагол с -ing: действие началось в прошлом и продолжается, либо только что закончилось и есть видимый результат. Акцент на длительности: I have been waiting for an hour. Why are you wet? Have you been running?'],
    ['Present perfect continuo', 'have/has been + verbo con -ing: acción que empezó en el pasado y sigue, o acaba de terminar con resultado visible. Se centra en la duración: I have been waiting for an hour. Why are you wet? Have you been running?'],
    ['Present Perfect Continuous', 'have/has been + Verb mit -ing: Handlung, die in der Vergangenheit begann und noch andauert oder gerade aufgehört hat mit sichtbarem Ergebnis. Betont die Dauer: I have been waiting for an hour. Why are you wet? Have you been running?'],
    ['Present Perfect Continuous', 'have/has been + glagol sa -ing: radnja počela u prošlosti i još traje ili je upravo prestala s vidljivim rezultatom. Naglasak na trajanju: I have been waiting for an hour. Why are you wet? Have you been running?'], [
    'g|I ___ (wait) for an hour.|have been waiting', 'g|She ___ (work) here since March.|has been working', 'g|How long ___ (you / learn) English?|have you been learning', 'g|It ___ (rain) all day.|has been raining', 'g|They ___ (not / sleep) well lately.|haven’t been sleeping', 'g|We ___ (talk) for two hours.|have been talking', 'g|Why are your hands dirty? ___ (you / cook)?|have you been cooking',

    'm|She’s tired because she ___ all night.|has been studying/studied/is studying', 'm|How long ___ you been waiting?|have/did/are', 'm|We’ve been living here ___ 2015.|since/for/during', 'm|It ___ for three days now.|has been snowing/snows/is snowing', 'm|I ___ this book for a week. I haven’t finished it.|have been reading/read/am read', 'm|He ___ in this company for ten years.|has been working/is working/works']);
  gexAdd('en', 'B1', 'b1-past-continuous', ['Past continuous vs past simple', 'Past continuous (was/were + -ing): an action in progress at a past moment or a longer background action. Past simple: a shorter action that interrupts or a completed event. I was cooking when the phone rang.'],
    ['Past Continuous и Past Simple', 'Past Continuous (was/were + -ing): действие в процессе в прошлом, длинный фон. Past Simple: короткое действие, которое прерывает, или завершённое событие. I was cooking when the phone rang.'],
    ['Pasado continuo y pasado simple', 'Past continuous (was/were + -ing): acción en curso en un momento pasado o fondo largo. Past simple: acción corta que interrumpe o hecho terminado. I was cooking when the phone rang.'],
    ['Past Continuous und Simple Past', 'Past Continuous (was/were + -ing): Handlung im Verlauf zu einem Zeitpunkt oder lange Hintergrundhandlung. Simple Past: kürzere unterbrechende Handlung oder abgeschlossenes Ereignis. I was cooking when the phone rang.'],
    ['Past Continuous i Past Simple', 'Past continuous (was/were + -ing): radnja u toku u prošlosti ili duža pozadinska radnja. Past simple: kraća radnja koja prekida ili završen događaj. I was cooking when the phone rang.'], [

    'm|While we ___ lunch, the phone rang.|were having/had/was having', 'm|I ___ a shower when you called.|was taking/took/am taking', 'm|It was raining when I ___ home.|left/was leaving/leave', 'm|What ___ he doing at midnight?|was/did/is', 'm|They ___ when the teacher came in.|were talking/talked/was talking', 'm|I fell asleep while I ___ TV.|was watching/watched/am watching']);
  gexAdd('en', 'B1', 'b1-second-conditional', ['Second conditional', 'If + past simple, would + base verb: unreal or unlikely situations in the present or future. If I had more money, I would buy a house. After I/he/she/it you can use were: If I were you, I wouldn’t go.'],
    ['Второе условное', 'If + Past Simple, would + инфинитив: нереальные или маловероятные ситуации в настоящем или будущем. If I had more money, I would buy a house. После I/he/she/it можно were: If I were you, I wouldn’t go.'],
    ['Segundo condicional', 'If + pasado simple, would + verbo base: situaciones irreales o improbables en presente o futuro. If I had more money, I would buy a house. Con I/he/she/it se puede usar were: If I were you, I wouldn’t go.'],
    ['Second Conditional', 'If + Simple Past, would + Grundform: unwirkliche oder unwahrscheinliche Situationen in Gegenwart oder Zukunft. If I had more money, I would buy a house. Nach I/he/she/it geht were: If I were you, I wouldn’t go.'],
    ['Drugi kondicional', 'If + past simple, would + osnovni oblik: nestvarne ili malo verovatne situacije u sadašnjosti ili budućnosti. If I had more money, I would buy a house. Uz I/he/she/it može were: If I were you, I wouldn’t go.'], [

    'g|If it ___ (not / be) so cold, we would go out.|weren’t/wasn’t', 'g|She ___ (help) you if she had time.|would help', 'g|If I ___ (speak) Italian, I would live in Rome.|spoke', 'g|___ (you / be) happy if you lived abroad?|would you be', 'g|If they ___ (not / have) a car, they would take the bus.|didn’t have', 'g|I ___ (not / say) that if I were you.|wouldn’t say', 'g|If he ___ (work) harder, he would pass.|worked',
    'm|If I ___ rich, I would help everyone.|were/am/will be', 'm|She would be happy if you ___ her.|called/call/will call', 'm|What would you do if you ___ a ghost?|saw/see/will see', 'm|If we had a garden, we ___ a dog.|would get/will get/get', 'm|I wouldn’t do that if I ___ you.|were/am/will be', 'm|If he ___ more, he would be healthier.|exercised/exercises/would exercise']);
  gexAdd('en', 'B1', 'b1-passive', ['Passive voice (present and past)', 'be + past participle. Present: is/are done; past: was/were done. Use it when the action matters more than who did it: The window was broken. Add by to name the doer: The book was written by Orwell.'],
    ['Страдательный залог (настоящее и прошедшее)', 'be + причастие прошедшего времени. Настоящее: is/are done; прошедшее: was/were done. Используется, когда важнее действие, а не исполнитель: The window was broken. Исполнитель вводится by: The book was written by Orwell.'],
    ['Voz pasiva (presente y pasado)', 'be + participio. Presente: is/are done; pasado: was/were done. Se usa cuando importa más la acción que quién la hizo: The window was broken. Con by se nombra al autor: The book was written by Orwell.'],
    ['Passiv (Gegenwart und Vergangenheit)', 'be + Partizip II. Gegenwart: is/are done; Vergangenheit: was/were done. Man nutzt es, wenn die Handlung wichtiger ist als der Handelnde: The window was broken. Mit by nennt man den Urheber: The book was written by Orwell.'],
    ['Pasiv (sadašnjost i prošlost)', 'be + particip. Sadašnjost: is/are done; prošlost: was/were done. Koristi se kad je radnja važnija od vršioca: The window was broken. Vršilac se uvodi sa by: The book was written by Orwell.'], [
    'g|English ___ (speak) all over the world.|is spoken', 'g|The windows ___ (clean) every week.|are cleaned', 'g|This book ___ (write) in 1990.|was written', 'g|The cake ___ (eat) yesterday.|was eaten', 'g|These cars ___ (make) in Germany.|are made', 'g|The thief ___ (arrest) last night.|was arrested', 'g|Where ___ (this wine / produce)?|is this wine produced',
    'g|The letters ___ (not / send) yesterday.|weren’t sent', 'g|My phone ___ (steal) on the bus.|was stolen', 'g|The room ___ (not / use) very often.|isn’t used', 'g|When ___ (the bridge / build)?|was the bridge built', 'g|Rice ___ (grow) in warm countries.|is grown', 'g|The meeting ___ (cancel) because of the strike.|was cancelled/was canceled', 'g|I ___ (invite) to the party last week.|was invited',
    'm|This room ___ every day.|is cleaned/cleans/is cleaning', 'm|The film ___ by a famous director.|was made/made/was make', 'm|Dinner ___ at eight.|is served/serves/is serve', 'm|The Mona Lisa ___ by Leonardo.|was painted/painted/is painted', 'm|My car ___ yesterday.|was repaired/repaired/is repaired', 'm|Many languages ___ in Switzerland.|are spoken/speak/are speak']);
  gexAdd('en', 'B1', 'b1-reported-speech', ['Reported speech', 'Move the tense one step back: am → was, like → liked, will → would, can → could, have done → had done. Questions: asked + if/whether or a question word, with normal word order (He asked where I lived). Commands: told + person + to … / not to …'],
    ['Косвенная речь', 'Время сдвигается назад: am → was, like → liked, will → would, can → could, have done → had done. Вопросы: asked + if/whether или вопросительное слово, прямой порядок слов (He asked where I lived). Приказы: told + кто-то + to … / not to …'],
    ['Estilo indirecto', 'El tiempo retrocede un paso: am → was, like → liked, will → would, can → could, have done → had done. Preguntas: asked + if/whether o palabra interrogativa, con orden normal (He asked where I lived). Órdenes: told + persona + to … / not to …'],
    ['Indirekte Rede', 'Die Zeit rückt einen Schritt zurück: am → was, like → liked, will → would, can → could, have done → had done. Fragen: asked + if/whether oder Fragewort, mit normaler Wortstellung (He asked where I lived). Befehle: told + Person + to … / not to …'],
    ['Neupravni govor', 'Vreme se pomera unazad: am → was, like → liked, will → would, can → could, have done → had done. Pitanja: asked + if/whether ili upitna reč, uz običan red reči (He asked where I lived). Naredbe: told + osoba + to … / not to …'], [
    'g|“I am tired,” she said. → She said she ___ tired.|was', 'g|“I like tea,” he said. → He said he ___ tea.|liked', 'g|“We are leaving,” they said. → They said they ___ leaving.|were', 'g|“I’ll call you,” she said. → She said she ___ call me.|would', 'g|“I can swim,” he said. → He said he ___ swim.|could', 'g|“I have finished,” she said. → She said she ___ finished.|had', 'g|“Where do you live?” he asked. → He asked me where I ___.|lived',
    'g|“Do you like fish?” she asked. → She asked me ___ I liked fish.|if/whether', 'g|“Open the window,” he said. → He told me ___ open the window.|to', 'g|“Don’t be late,” she said. → She told us ___ be late.|not to', 'g|“I’m working now,” he said. → He said he ___ working then.|was', 'g|“I saw Tom yesterday,” she said. → She said she ___ seen Tom the day before.|had', 'g|“I live in Rome,” he said. → He said that he ___ in Rome.|lived', 'g|“Where do you come from?” she asked. → She asked where I ___ from.|came',
    'm|He said he ___ tired.|was/is/will be', 'm|She asked me what I ___.|wanted/want/was wanting', 'm|He told me ___ there.|to wait/wait/waiting', 'm|They said they ___ the next day.|would come/will come/come', 'm|She asked ___ I was ready.|if/that/what', 'm|He told me he ___ to Peru twice.|had been/has been/is being']);
  gexAdd('en', 'B1', 'b1-modals-deduction', ['Modals of deduction and obligation', 'Certain: must be (He must be at home). Impossible: can’t be (That can’t be true). Possible: might / may / could be. Obligation: must / have to; not necessary: don’t have to; past obligation: had to.'],
    ['Модальные глаголы: догадка и обязанность', 'Уверенность: must be (He must be at home). Невозможно: can’t be (That can’t be true). Возможно: might / may / could be. Обязанность: must / have to; не нужно: don’t have to; в прошлом: had to.'],
    ['Modales de deducción y obligación', 'Seguro: must be (He must be at home). Imposible: can’t be (That can’t be true). Posible: might / may / could be. Obligación: must / have to; no necesario: don’t have to; pasado: had to.'],
    ['Modalverben: Vermutung und Pflicht', 'Sicher: must be (He must be at home). Unmöglich: can’t be (That can’t be true). Möglich: might / may / could be. Pflicht: must / have to; nicht nötig: don’t have to; Vergangenheit: had to.'],
    ['Modalni glagoli: zaključivanje i obaveza', 'Sigurno: must be (He must be at home). Nemoguće: can’t be (That can’t be true). Moguće: might / may / could be. Obaveza: must / have to; nije potrebno: don’t have to; prošlost: had to.'], [
    'g|She’s not answering. She ___ be asleep. (probably)|must', 'g|That ___ be true! It’s impossible.|can’t', 'g|He ___ be at home. His car is outside. (I’m sure)|must', 'g|It ___ rain later. I’m not sure.|might/may/could', 'g|They ___ be tired after the long flight. (I’m sure)|must', 'g|Last week I ___ get up at five. (it was necessary)|had to', 'g|You ___ wear a seat belt. It’s the law.|must/have to',
    'g|She ___ be a doctor. She’s only fifteen.|can’t', 'g|They ___ be lost. I’m not sure.|might/may/could', 'g|I ___ work tomorrow. It’s a holiday. (not necessary)|don’t have to', 'g|We ___ finish this today. It’s urgent.|must/have to', 'g|He ___ be very rich. He has three houses.|must', 'g|She ___ have the keys. Ask her. (possible)|might/may/could', 'g|I ___ go to the dentist yesterday. It was painful.|had to',
    'm|The lights are on. They ___ be at home.|must/can’t/don’t have to', 'm|He ___ be our teacher. He’s too young.|can’t/must/has to', 'm|We ___ leave now or we’ll miss the bus.|have to/can’t/might to', 'm|It ___ be a mistake, but I’m not sure.|might/must/has to', 'm|You ___ pay to park here. It’s free.|don’t have to/mustn’t/can’t', 'm|She never smiles. She ___ be very sad.|must/doesn’t have to/mustn’t']);
  gexAdd('en', 'B1', 'b1-gerund-infinitive', ['Gerund or infinitive', 'Verb + -ing: enjoy, finish, avoid, mind, suggest, stop, can’t stand, and after prepositions (good at cooking). Verb + to: want, decide, hope, agree, promise, refuse, manage, would like.'],

    ['Gerundio o infinitivo', 'Verbo + -ing: enjoy, finish, avoid, mind, suggest, stop, can’t stand, y tras preposición (good at cooking). Verbo + to: want, decide, hope, agree, promise, refuse, manage, would like.'],
    ['Gerund oder Infinitiv', 'Verb + -ing: enjoy, finish, avoid, mind, suggest, stop, can’t stand und nach Präpositionen (good at cooking). Verb + to: want, decide, hope, agree, promise, refuse, manage, would like.'],

  gexAdd('en', 'B1', 'b1-relative-clauses', ['Relative clauses: defining and non-defining', 'Defining (no commas): necessary to identify the noun; who/that/which, and that can be used. Non-defining (commas): extra information; use who/which, never that: My brother, who is 30, is a teacher. Whose = of whom; where = place.'],
    ['Относительные придаточные', 'Определительные (без запятых): нужны, чтобы понять, о ком речь; можно who/that/which. Дополнительные (в запятых): лишняя информация; только who/which, не that: My brother, who is 30, is a teacher. Whose = чей; where = место.'],
    ['Oraciones de relativo', 'Especificativas (sin comas): necesarias para identificar; sirven who/that/which. Explicativas (con comas): información extra; solo who/which, nunca that: My brother, who is 30, is a teacher. Whose = cuyo; where = lugar.'],
    ['Relativsätze', 'Defining (ohne Kommas): nötig, um das Nomen zu bestimmen; who/that/which möglich. Non-defining (mit Kommas): Zusatzinfo; nur who/which, nie that: My brother, who is 30, is a teacher. Whose = dessen; where = Ort.'],
    ['Odnosne rečenice', 'Defining (bez zareza): potrebne da se odredi imenica; može who/that/which. Non-defining (sa zarezima): dodatna informacija; samo who/which, nikad that: My brother, who is 30, is a teacher. Whose = čiji; where = mesto.'], [

  gexAdd('en', 'B1', 'b1-future-clauses', ['Future time clauses and future forms', 'After when, as soon as, until, before, after and if, use the present, not will: I’ll call you when I arrive. Present continuous = fixed arrangement (I’m seeing the doctor at four); present simple = timetable (The train leaves at six).'],
    ['Придаточные времени и формы будущего', 'После when, as soon as, until, before, after и if ставьте настоящее время, а не will: I’ll call you when I arrive. Present Continuous: договорённость (I’m seeing the doctor at four); Present Simple: расписание (The train leaves at six).'],
    ['Subordinadas temporales y formas de futuro', 'Tras when, as soon as, until, before, after e if se usa presente, no will: I’ll call you when I arrive. Present continuous: cita acordada (I’m seeing the doctor at four); present simple: horario (The train leaves at six).'],
    ['Zeitsätze und Zukunftsformen', 'Nach when, as soon as, until, before, after und if steht das Präsens, nicht will: I’ll call you when I arrive. Present Continuous: feste Verabredung (I’m seeing the doctor at four); Present Simple: Fahrplan (The train leaves at six).'],
    ['Vremenske rečenice i oblici budućnosti', 'Posle when, as soon as, until, before, after i if koristi se prezent, ne will: I’ll call you when I arrive. Present continuous: dogovoren termin (I’m seeing the doctor at four); present simple: red vožnje (The train leaves at six).'], [

  gexAdd('en', 'B2', 'b2-conditionals', ['Third and mixed conditionals', 'Third: if + past perfect, would have + past participle (an unreal past: If I had studied, I would have passed). Mixed: past condition, present result (If I had taken that job, I would be living in Paris now) or the reverse (If I were rich, I would have bought it).'],

  gexAdd('en', 'B2', 'b2-wish', ['Wish, if only, would rather', 'Present regret: wish + past simple (I wish I had more time). Past regret: wish + past perfect (I wish I hadn’t said that). Annoyance or change: wish + would (I wish he would stop). Would rather + base verb (my choice) or + past tense (someone else’s action).'],
    ['Wish, if only, would rather', 'Сожаление о настоящем: wish + Past Simple (I wish I had more time). О прошлом: wish + Past Perfect (I wish I hadn’t said that). Раздражение или желание перемен: wish + would (I wish he would stop). Would rather + инфинитив (мой выбор) или + прошедшее время (действие другого).'],
    ['Wish, if only, would rather', 'Pesar presente: wish + pasado simple (I wish I had more time). Pesar pasado: wish + pasado perfecto (I wish I hadn’t said that). Queja o cambio: wish + would (I wish he would stop). Would rather + verbo base (mi elección) o + pasado (acción de otro).'],

  gexAdd('en', 'B2', 'b2-past-perfect', ['Past perfect simple and continuous', 'Past perfect (had + past participle): the earlier of two past events (When I arrived, the film had started). Past perfect continuous (had been + -ing): an action in progress before a past moment, focus on duration (I had been waiting for an hour).'],

  gexAdd('en', 'B2', 'b2-future-perfect', ['Future continuous and future perfect', 'Future continuous (will be + -ing): in progress at a future moment (This time tomorrow I’ll be flying). Future perfect (will have + past participle): finished before a future moment (By Friday I’ll have finished). Add been + -ing for duration.'],

  gexAdd('en', 'B2', 'b2-relative-reduced', ['Non-defining and reduced relative clauses', 'A relative clause can be shortened with -ing (active: the girl standing there) or a past participle (passive: the book written by Orwell). Prepositions can come before whom/which (the person to whom I spoke). Which can refer to a whole clause: He passed, which surprised everyone.'],
    ['Сложные и сокращённые относительные предложения', 'Придаточное можно сократить: -ing (действие: the girl standing there) или причастие II (страдательное: the book written by Orwell). Предлог может стоять перед whom/which (the person to whom I spoke). Which может относиться ко всему предложению: He passed, which surprised everyone.'],
    ['Relativas explicativas y reducidas', 'La oración de relativo se acorta con -ing (activa: the girl standing there) o participio (pasiva: the book written by Orwell). La preposición puede ir antes de whom/which (the person to whom I spoke). Which puede referirse a toda la oración: He passed, which surprised everyone.'],
    ['Nicht-definierende und verkürzte Relativsätze', 'Ein Relativsatz lässt sich mit -ing (aktiv: the girl standing there) oder Partizip II (passiv: the book written by Orwell) verkürzen. Die Präposition kann vor whom/which stehen (the person to whom I spoke). Which kann sich auf den ganzen Satz beziehen: He passed, which surprised everyone.'],

  gexAdd('en', 'B2', 'b2-linking', ['Linking and contrast', 'Although / even though / while + clause; despite / in spite of + noun or -ing; whereas = but (comparing). However / nevertheless start a new sentence. Because + clause, because of + noun; so = result; so that = purpose; in case = as a precaution.'],
    ['Союзы и контраст', 'Although / even though / while + предложение; despite / in spite of + существительное или -ing; whereas = в то время как (сравнение). However / nevertheless начинают новое предложение. Because + предложение, because of + существительное; so = результат; so that = цель; in case = на случай.'],
    ['Conectores y contraste', 'Although / even though / while + oración; despite / in spite of + sustantivo o -ing; whereas = mientras que (comparación). However / nevertheless empiezan frase nueva. Because + oración, because of + sustantivo; so = resultado; so that = finalidad; in case = por si acaso.'],
    ['Konnektoren und Gegensatz', 'Although / even though / while + Satz; despite / in spite of + Nomen oder -ing; whereas = während (Vergleich). However / nevertheless beginnen einen neuen Satz. Because + Satz, because of + Nomen; so = Folge; so that = Zweck; in case = für den Fall.'],
    ['Veznici i kontrast', 'Although / even though / while + rečenica; despite / in spite of + imenica ili -ing; whereas = dok (poređenje). However / nevertheless počinju novu rečenicu. Because + rečenica, because of + imenica; so = posledica; so that = svrha; in case = za slučaj da.'], [

    'g|She left early, ___ she missed the end.|so', 'g|I don’t like it. ___, I’ll try it.|however/nevertheless/still', 'g|It was cheap. ___, the quality was poor.|however/nevertheless', 'g|___ of the rain, we stayed in.|because', 'g|She works hard; ___, she never gets promoted.|nevertheless/however', 'g|___ I like coffee, I prefer tea.|although/though/while', 'g|He was late ___ the traffic.|because of/due to/owing to',
    'm|___ being tired, she went to the party.|Despite/Although/Because', 'm|He didn’t go ___ he wasn’t invited.|because/despite/however', 'm|I’ll take an umbrella ___ it rains.|in case/despite/although', 'm|She works abroad, ___ her husband stays at home.|whereas/despite/because of', 'm|___ the fact that it was cold, they swam.|In spite of/Although/However', 'm|It was late, ___ we decided to leave.|so/although/despite']);
  gexAdd('en', 'B2', 'b2-verb-patterns', ['Verb patterns that change meaning', 'Remember/forget/regret + -ing = about the past (I remember locking it); + to = about a duty or news (Remember to lock it). Stop + -ing = quit; stop + to = pause in order to. Try + -ing = experiment; try + to = attempt. Go on + -ing = continue; go on + to = next.'],
    ['Глаголы, меняющие значение', 'Remember/forget/regret + -ing: о прошлом (I remember locking it); + to: об обязанности или новости (Remember to lock it). Stop + -ing: бросить; stop + to: остановиться, чтобы. Try + -ing: попробовать (эксперимент); try + to: пытаться. Go on + -ing: продолжать; go on + to: перейти к следующему.'],
    ['Verbos que cambian de significado', 'Remember/forget/regret + -ing = sobre el pasado (I remember locking it); + to = deber o noticia (Remember to lock it). Stop + -ing = dejar de; stop + to = pararse para. Try + -ing = probar; try + to = intentar. Go on + -ing = continuar; go on + to = pasar a lo siguiente.'],
    ['Verben, die die Bedeutung ändern', 'Remember/forget/regret + -ing = Vergangenes (I remember locking it); + to = Pflicht oder Nachricht (Remember to lock it). Stop + -ing = aufhören; stop + to = anhalten, um. Try + -ing = ausprobieren; try + to = versuchen. Go on + -ing = weitermachen; go on + to = übergehen zu.'],
    ['Glagoli koji menjaju značenje', 'Remember/forget/regret + -ing = o prošlosti (I remember locking it); + to = o dužnosti ili vesti (Remember to lock it). Stop + -ing = prestati; stop + to = stati da bi. Try + -ing = probati; try + to = pokušati. Go on + -ing = nastaviti; go on + to = preći na sledeće.'], [
    'g|I remember ___ (lock) the door, so it’s fine.|locking', 'g|Remember ___ (lock) the door when you leave.|to lock', 'g|He stopped ___ (smoke) last year. (he quit)|smoking', 'g|She stopped ___ (buy) milk on the way home. (she paused in order to)|to buy', 'g|I regret ___ (tell) him the secret. I wish I hadn’t.|telling', 'g|I regret ___ (inform) you that the flight is cancelled.|to inform', 'g|Try ___ (turn) it off and on again. (experiment)|turning',
    'g|I tried ___ (open) the door, but it was stuck. (attempt)|to open', 'g|I forgot ___ (post) the letter. It’s still in my bag.|to post', 'g|I’ll never forget ___ (meet) her. It was amazing.|meeting', 'g|We went on ___ (talk) until midnight. (continued)|talking', 'g|After the introduction, she went on ___ (explain) the plan. (next)|to explain', 'g|I like ___ (visit) my parents every week.|to visit/visiting', 'g|He meant ___ (call) you, but he forgot.|to call',
    'm|I’ll never forget ___ the Eiffel Tower for the first time.|seeing/to see/see', 'm|Don’t forget ___ the lights.|to turn off/turning off/turn off', 'm|We stopped ___ a coffee on the way.|to have/having/have', 'm|I regret ___ you that you didn’t get the job.|to tell/telling/tell', 'm|I remember ___ to Spain as a child.|going/to go/go', 'm|She went on ___ about her trip for hours.|talking/to talk/talk']);
    /* Spanish A1 */
  gexAdd('es', 'A1', 'es-a1-articles', ['Articles, gender and number', 'Nouns are masculine or feminine: el/un (masculine), la/una (feminine). Plural: los/las, unos/unas. Add -s after a vowel and -es after a consonant (casa → casas, lápiz → lápices). Feminine nouns with a stressed a- take el in the singular: el agua.'],
    ['Артикли, род и число', 'Существительные мужского и женского рода: el/un (м.), la/una (ж.). Множественное число: los/las, unos/unas. После гласной -s, после согласной -es (casa → casas, lápiz → lápices). Женские слова с ударным a- в ед. числе берут el: el agua.'],
    ['Artículos, género y número', 'Los sustantivos son masculinos o femeninos: el/un, la/una. Plural: los/las, unos/unas. Se añade -s tras vocal y -es tras consonante (casa → casas, lápiz → lápices). Los femeninos con a- tónica llevan el en singular: el agua.'],
    ['Artikel, Genus und Numerus', 'Nomen sind maskulin oder feminin: el/un, la/una. Plural: los/las, unos/unas. Nach Vokal -s, nach Konsonant -es (casa → casas, lápiz → lápices). Feminine Nomen mit betontem a- haben im Singular el: el agua.'],
    ['Članovi, rod i broj', 'Imenice su muškog ili ženskog roda: el/un, la/una. Množina: los/las, unos/unas. Posle samoglasnika -s, posle suglasnika -es (casa → casas, lápiz → lápices). Ženske imenice s naglašenim a- u jednini imaju el: el agua.'], [
    'g|___ casa es grande.|La', 'g|Tengo ___ perro.|un', 'g|___ libros están en la mesa.|Los', 'g|Quiero ___ naranja.|una', 'g|___ problema es difícil.|El', 'g|___ mano está fría.|La', 'g|Hay ___ mapas en la clase.|unos',
    'g|Vivo en ___ ciudad bonita.|una', 'g|___ día es largo.|El', 'g|Un lápiz, dos ___.|lápices', 'g|Una mujer, muchas ___.|mujeres', 'g|___ agua está fría.|El', 'g|Me gusta ___ café.|el', 'g|___ profesora es simpática.|La',
    'm|___ idioma es difícil.|El/La/Los', 'm|Compro ___ flores.|unas/un/una', 'm|Los ___ son rojos.|coches/coche/cochas', 'm|___ clase es interesante.|La/El/Los', 'm|Tengo ___ amigas en Madrid.|unas/unos/un', 'm|___ planta es verde.|La/El/Las']);
  gexAdd('es', 'A1', 'es-a1-present-regular', ['Present tense: regular verbs', 'Remove -ar/-er/-ir and add the ending: hablo, hablas, habla, hablamos, habláis, hablan (-ar); como, comes, come, comemos, coméis, comen (-er); vivo, vives, vive, vivimos, vivís, viven (-ir).'],
    ['Настоящее время: правильные глаголы', 'Отбросьте -ar/-er/-ir и добавьте окончание: hablo, hablas, habla, hablamos, habláis, hablan (-ar); como, comes, come, comemos, coméis, comen (-er); vivo, vives, vive, vivimos, vivís, viven (-ir).'],
    ['Presente de indicativo: verbos regulares', 'Quita -ar/-er/-ir y añade la terminación: hablo, hablas, habla, hablamos, habláis, hablan (-ar); como, comes, come, comemos, coméis, comen (-er); vivo, vives, vive, vivimos, vivís, viven (-ir).'],
    ['Präsens: regelmäßige Verben', 'Streiche -ar/-er/-ir und hänge die Endung an: hablo, hablas, habla, hablamos, habláis, hablan (-ar); como, comes, come, comemos, coméis, comen (-er); vivo, vives, vive, vivimos, vivís, viven (-ir).'],
    ['Prezent: pravilni glagoli', 'Odbaci -ar/-er/-ir i dodaj nastavak: hablo, hablas, habla, hablamos, habláis, hablan (-ar); como, comes, come, comemos, coméis, comen (-er); vivo, vives, vive, vivimos, vivís, viven (-ir).'], [

    'g|Mi madre ___ (cocinar) muy bien.|cocina', 'g|Nosotros ___ (abrir) la puerta.|abrimos', 'g|¿Tú ___ (estudiar) inglés?|estudias', 'g|Los niños ___ (aprender) rápido.|aprenden', 'g|Vosotros ___ (vivir) cerca.|vivís', 'g|Yo no ___ (beber) café.|bebo', 'g|¿Dónde ___ (trabajar) usted?|trabaja',
    'm|Ellos ___ en una oficina.|trabajan/trabaja/trabajamos', 'm|Nosotros ___ pizza.|comemos/comen/comes', 'm|Tú ___ en el centro.|vives/vive/vivo', 'm|Yo ___ música.|escucho/escuchas/escucha', 'm|Ella ___ muchos libros.|lee/leo/lees', 'm|Vosotros ___ español.|habláis/hablan/hablamos']);
  gexAdd('es', 'A1', 'es-a1-ser', ['Ser', 'soy, eres, es, somos, sois, son. Use ser for identity (Soy Ana), origin (Soy de Perú), profession, nationality, characteristics (Es alto), time and dates (Son las tres. Hoy es lunes), and possession.'],
    ['Глагол ser', 'soy, eres, es, somos, sois, son. Ser: кто ты (Soy Ana), откуда (Soy de Perú), профессия, национальность, свойства (Es alto), время и даты (Son las tres. Hoy es lunes), принадлежность.'],
    ['El verbo ser', 'soy, eres, es, somos, sois, son. Ser para identidad (Soy Ana), origen (Soy de Perú), profesión, nacionalidad, características (Es alto), hora y fechas (Son las tres. Hoy es lunes) y posesión.'],
    ['Das Verb ser', 'soy, eres, es, somos, sois, son. Ser für Identität (Soy Ana), Herkunft (Soy de Perú), Beruf, Nationalität, Eigenschaften (Es alto), Uhrzeit und Datum (Son las tres. Hoy es lunes) und Besitz.'],
    ['Glagol ser', 'soy, eres, es, somos, sois, son. Ser za identitet (Soy Ana), poreklo (Soy de Perú), zanimanje, nacionalnost, osobine (Es alto), vreme i datume (Son las tres. Hoy es lunes) i pripadnost.'], [
    'g|Yo ___ profesora.|soy', 'g|Tú ___ de Argentina.|eres', 'g|Él ___ alto.|es', 'g|Nosotros ___ estudiantes.|somos', 'g|Vosotros ___ mis amigos.|sois', 'g|Ellas ___ de México.|son', 'g|Hoy ___ lunes.|es',

    'm|Ella ___ doctora.|es/está/son', 'm|Nosotros ___ de Italia.|somos/estamos/son', 'm|Ellos ___ altos.|son/están/es', 'm|¿De dónde ___ tú?|eres/estás/es', 'm|Yo ___ estudiante.|soy/estoy/es', 'm|Estas flores ___ rojas.|son/están/es']);
  gexAdd('es', 'A1', 'es-a1-estar', ['Estar, and ser vs estar', 'estoy, estás, está, estamos, estáis, están. Use estar for location (Madrid está en España), temporary states and feelings (Estoy cansado), and health. Ser = what something is; estar = where or how it is now.'],
    ['Estar, и ser или estar', 'estoy, estás, está, estamos, estáis, están. Estar: местонахождение (Madrid está en España), временные состояния и чувства (Estoy cansado), здоровье. Ser = что это такое; estar = где это или каково сейчас.'],
    ['Estar, y ser o estar', 'estoy, estás, está, estamos, estáis, están. Estar para ubicación (Madrid está en España), estados temporales y sentimientos (Estoy cansado) y salud. Ser = lo que algo es; estar = dónde o cómo está ahora.'],
    ['Estar, und ser oder estar', 'estoy, estás, está, estamos, estáis, están. Estar für Ort (Madrid está en España), vorübergehende Zustände und Gefühle (Estoy cansado) und Gesundheit. Ser = was etwas ist; estar = wo oder wie es gerade ist.'],
    ['Estar, i ser ili estar', 'estoy, estás, está, estamos, estáis, están. Estar za mesto (Madrid está en España), privremena stanja i osećanja (Estoy cansado) i zdravlje. Ser = šta je nešto; estar = gde je ili kako je sada.'], [
    'g|Yo ___ en casa.|estoy', 'g|Tú ___ cansado.|estás', 'g|Ella ___ en el trabajo.|está', 'g|Nosotros ___ contentos.|estamos', 'g|Vosotros ___ en la playa.|estáis', 'g|Ellos ___ en Madrid.|están', 'g|La sopa ___ caliente.|está',
    'g|Madrid ___ en España.|está', 'g|Mi hermano ___ enfermo hoy.|está', 'g|¿Cómo ___ usted?|está', 'g|Mis llaves ___ en la mesa.|están', 'g|¿Dónde ___ el baño?|está', 'g|Hoy ___ muy cansada.|estoy', 'g|Los niños ___ en el parque.|están',
    'm|Mi tío ___ médico.|es/está/son', 'm|El café ___ frío.|está/es/están', 'm|___ de Perú. (yo)|Soy/Estoy/Es', 'm|¿Dónde ___ los baños?|están/son/es', 'm|Mi madre ___ muy simpática.|es/está/estoy', 'm|Hoy el cielo ___ nublado.|está/es/están']);
  gexAdd('es', 'A1', 'es-a1-tener-hay', ['Tener, hay, tener que', 'tengo, tienes, tiene, tenemos, tenéis, tienen. Tener is also used for age (Tengo 25 años) and feelings (tengo hambre, frío, sed). Hay = there is / there are, and it never changes. Tener que + infinitive = must, have to.'],
    ['Tener, hay, tener que', 'tengo, tienes, tiene, tenemos, tenéis, tienen. Tener также для возраста (Tengo 25 años) и ощущений (tengo hambre, frío, sed). Hay = есть/имеется, не меняется. Tener que + инфинитив = должен.'],
    ['Tener, hay, tener que', 'tengo, tienes, tiene, tenemos, tenéis, tienen. Tener sirve también para la edad (Tengo 25 años) y sensaciones (tengo hambre, frío, sed). Hay = there is / there are, nunca cambia. Tener que + infinitivo = obligación.'],
    ['Tener, hay, tener que', 'tengo, tienes, tiene, tenemos, tenéis, tienen. Tener auch für Alter (Tengo 25 años) und Empfindungen (tengo hambre, frío, sed). Hay = es gibt, unveränderlich. Tener que + Infinitiv = müssen.'],
    ['Tener, hay, tener que', 'tengo, tienes, tiene, tenemos, tenéis, tienen. Tener i za godine (Tengo 25 años) i osećaje (tengo hambre, frío, sed). Hay = ima, ne menja se. Tener que + infinitiv = morati.'], [

    'g|En la clase ___ veinte estudiantes.|hay', 'g|No ___ leche en la nevera.|hay', 'g|Yo ___ que trabajar hoy.|tengo', 'g|¿Cuántos años ___ tú?|tienes', 'g|Nosotros ___ que estudiar.|tenemos', 'g|¿___ un banco por aquí?|Hay', 'g|Ella ___ que salir temprano.|tiene',
    'm|Mi hermano ___ sed.|tiene/tienen/tengo', 'm|___ muchos coches en la calle.|Hay/Tienen/Está', 'm|Ellos ___ que estudiar.|tienen/tiene/tienes', 'm|¿Qué ___ en la mesa?|hay/tiene/está', 'm|Yo ___ frío.|tengo/tiene/soy', 'm|Vosotros ___ que venir.|tenéis/tienen/tenemos']);
  gexAdd('es', 'A1', 'es-a1-gustar', ['Gustar and similar verbs', 'Gustar agrees with the thing liked, not the person: me gusta el café, me gustan los gatos. With a verb: me gusta bailar. Pronouns: me, te, le, nos, os, les. A mí / a ti / a él … adds emphasis (A mí me gusta).'],
    ['Глагол gustar и подобные', 'Gustar согласуется с тем, что нравится, а не с человеком: me gusta el café, me gustan los gatos. С глаголом: me gusta bailar. Местоимения: me, te, le, nos, os, les. A mí / a ti / a él … усиливает (A mí me gusta).'],
    ['Gustar y verbos parecidos', 'Gustar concuerda con lo que gusta, no con la persona: me gusta el café, me gustan los gatos. Con verbo: me gusta bailar. Pronombres: me, te, le, nos, os, les. A mí / a ti / a él … da énfasis (A mí me gusta).'],
    ['Gustar und ähnliche Verben', 'Gustar richtet sich nach dem, was gefällt, nicht nach der Person: me gusta el café, me gustan los gatos. Mit Verb: me gusta bailar. Pronomen: me, te, le, nos, os, les. A mí / a ti / a él … betont (A mí me gusta).'],
    ['Gustar i slični glagoli', 'Gustar se slaže s onim što se sviđa, ne s osobom: me gusta el café, me gustan los gatos. Sa glagolom: me gusta bailar. Zamenice: me, te, le, nos, os, les. A mí / a ti / a él … naglašava (A mí me gusta).'], [
    'g|Me ___ el chocolate.|gusta', 'g|Me ___ los gatos.|gustan', 'g|A ella le ___ bailar.|gusta', 'g|¿Te ___ la música?|gusta', 'g|A nosotros ___ gustan las películas.|nos', 'g|¿Os ___ viajar?|gusta', 'g|A ellos les ___ las fiestas.|gustan',
    'g|A mí no ___ gusta el pescado.|me', 'g|A él ___ gusta el fútbol.|le', 'g|A mí me ___ cantar y bailar.|gusta', 'g|¿A ti ___ gustan los perros?|te', 'g|A vosotros ___ gusta la playa.|os', 'g|Me ___ mucho las manzanas.|gustan', 'g|A ellos no ___ gusta madrugar.|les',
    'm|Me ___ leer libros.|gusta/gustan/gusto', 'm|Nos ___ los helados.|gustan/gusta/gustamos', 'm|A Pedro ___ gusta la pizza.|le/les/se', 'm|¿Te ___ estos zapatos?|gustan/gusta/gustas', 'm|A mis padres ___ gusta viajar.|les/le/se', 'm|A mí no ___ gusta el café.|me/yo/mi']);
  gexAdd('es', 'A1', 'es-a1-possessives', ['Possessives and demonstratives', 'Before a noun: mi, tu, su, nuestro/a, vuestro/a, su (they agree with the thing owned: mis libros, nuestras casas). Demonstratives: este/esta (near), ese/esa (a bit far), aquel/aquella (far); plural: estos, esos, aquellos.'],
    ['Притяжательные и указательные', 'Перед существительным: mi, tu, su, nuestro/a, vuestro/a, su (согласуются с предметом: mis libros, nuestras casas). Указательные: este/esta (близко), ese/esa (подальше), aquel/aquella (далеко); мн. ч.: estos, esos, aquellos.'],
    ['Posesivos y demostrativos', 'Antes del nombre: mi, tu, su, nuestro/a, vuestro/a, su (concuerdan con lo poseído: mis libros, nuestras casas). Demostrativos: este/esta (cerca), ese/esa (algo lejos), aquel/aquella (lejos); plural: estos, esos, aquellos.'],
    ['Possessiv- und Demonstrativpronomen', 'Vor dem Nomen: mi, tu, su, nuestro/a, vuestro/a, su (richten sich nach dem Besitz: mis libros, nuestras casas). Demonstrativa: este/esta (nah), ese/esa (etwas weiter), aquel/aquella (weit); Plural: estos, esos, aquellos.'],
    ['Prisvojne i pokazne zamenice', 'Ispred imenice: mi, tu, su, nuestro/a, vuestro/a, su (slažu se sa stvari koja se poseduje: mis libros, nuestras casas). Pokazne: este/esta (blizu), ese/esa (malo dalje), aquel/aquella (daleko); množina: estos, esos, aquellos.'], [
    'g|___ casa es grande. (yo)|Mi', 'g|¿Dónde está ___ libro? (tú)|tu', 'g|___ madre es profesora. (él)|Su', 'g|___ amigos son simpáticos. (nosotros)|Nuestros', 'g|___ hijas viven en Roma. (vosotros)|Vuestras', 'g|___ padres trabajan aquí. (ellos)|Sus', 'g|___ libro está aquí. (this)|Este',
    'g|___ casa es nueva. (this)|Esta', 'g|___ zapatos son caros. (those, far)|Aquellos/Esos', 'g|¿Cuánto cuestan ___ manzanas? (these)|estas', 'g|___ coche es de mi padre. (that, near you)|Ese', 'g|Estas son mis llaves. ¿Dónde están ___? (yours, tú)|las tuyas', 'g|___ hermano vive en Chile. (yo)|Mi', 'g|___ ventanas están abiertas. (nosotros)|Nuestras',
    'm|___ gafas son de mi hermana.|Estas/Este/Esto', 'm|¿Es ___ coche? (tú)|tu/tuyo/tus', 'm|Ellos viven con ___ abuelos.|sus/su/suyos', 'm|Mira ___ edificio de allí, lejos.|aquel/este/estos', 'm|Nosotros queremos ___ casa.|nuestra/nuestro/nuestras', 'm|¿___ son tus amigos? (these)|Estos/Esto/Esta']);
  gexAdd('es', 'A1', 'es-a1-questions', ['Question words', 'Always written with an accent: qué, quién, cuál, cuándo, dónde, cómo, cuánto, por qué (porque = because). They agree: cuántos libros, cuántas personas. Use ¿ at the start and ? at the end. Cuál/cuáles = which one(s).'],
    ['Вопросительные слова', 'Всегда с ударением: qué, quién, cuál, cuándo, dónde, cómo, cuánto, por qué (porque = потому что). Согласуются: cuántos libros, cuántas personas. ¿ в начале и ? в конце. Cuál/cuáles = какой из.'],
    ['Palabras interrogativas', 'Siempre llevan tilde: qué, quién, cuál, cuándo, dónde, cómo, cuánto, por qué (porque = because). Concuerdan: cuántos libros, cuántas personas. ¿ al inicio y ? al final. Cuál/cuáles = which one(s).'],
    ['Fragewörter', 'Immer mit Akzent: qué, quién, cuál, cuándo, dónde, cómo, cuánto, por qué (porque = weil). Sie passen sich an: cuántos libros, cuántas personas. ¿ am Anfang und ? am Ende. Cuál/cuáles = welche(r).'],
    ['Upitne reči', 'Uvek s akcentom: qué, quién, cuál, cuándo, dónde, cómo, cuánto, por qué (porque = zato što). Slažu se: cuántos libros, cuántas personas. ¿ na početku i ? na kraju. Cuál/cuáles = koji od.'], [

  gexAdd('es', 'A1', 'es-a1-irregular-present', ['Irregular present tense', 'Stem changes: e → ie (querer: quiero), o → ue (poder: puedo, dormir: duermo), u → ue (jugar: juego). These do not change in nosotros/vosotros (queremos, podemos). Irregular yo: hago, pongo, salgo, digo, veo, sé. Ir: voy, vas, va, vamos, vais, van.'],
    ['Неправильные глаголы в настоящем времени', 'Чередования в корне: e → ie (querer: quiero), o → ue (poder: puedo, dormir: duermo), u → ue (jugar: juego). В nosotros/vosotros не меняются (queremos, podemos). Особая форма yo: hago, pongo, salgo, digo, veo, sé. Ir: voy, vas, va, vamos, vais, van.'],
    ['Presente irregular', 'Cambios en la raíz: e → ie (querer: quiero), o → ue (poder: puedo, dormir: duermo), u → ue (jugar: juego). No cambian en nosotros/vosotros (queremos, podemos). Yo irregular: hago, pongo, salgo, digo, veo, sé. Ir: voy, vas, va, vamos, vais, van.'],
    ['Unregelmäßiges Präsens', 'Stammwechsel: e → ie (querer: quiero), o → ue (poder: puedo, dormir: duermo), u → ue (jugar: juego). Bei nosotros/vosotros bleibt der Stamm (queremos, podemos). Besondere yo-Formen: hago, pongo, salgo, digo, veo, sé. Ir: voy, vas, va, vamos, vais, van.'],
    ['Nepravilni prezent', 'Promene osnove: e → ie (querer: quiero), o → ue (poder: puedo, dormir: duermo), u → ue (jugar: juego). U nosotros/vosotros se ne menjaju (queremos, podemos). Posebno yo: hago, pongo, salgo, digo, veo, sé. Ir: voy, vas, va, vamos, vais, van.'], [

    'm|Yo ___ a la playa.|voy/va/vas', 'm|Ella ___ dormir.|quiere/queremos/quieres', 'm|Nosotros ___ ayudarte.|podemos/puedemos/pueden', 'm|Los niños ___ en el parque.|juegan/jugan/juega', 'm|Yo ___ la verdad.|digo/dico/dice', 'm|Tú ___ muy tarde.|vienes/venes/vienen']);
  gexAdd('es', 'A1', 'es-a1-reflexive', ['Reflexive verbs and daily routine', 'The pronoun goes before the verb and matches the subject: me levanto, te levantas, se levanta, nos levantamos, os levantáis, se levantan. Common: levantarse, ducharse, vestirse, acostarse, llamarse. Many have a stem change (me acuesto, me visto).'],
    ['Возвратные глаголы и распорядок дня', 'Местоимение стоит перед глаголом и соответствует подлежащему: me levanto, te levantas, se levanta, nos levantamos, os levantáis, se levantan. Частые: levantarse, ducharse, vestirse, acostarse, llamarse. Многие с чередованием (me acuesto, me visto).'],
    ['Verbos reflexivos y rutina diaria', 'El pronombre va antes del verbo y concuerda con el sujeto: me levanto, te levantas, se levanta, nos levantamos, os levantáis, se levantan. Frecuentes: levantarse, ducharse, vestirse, acostarse, llamarse. Muchos cambian la raíz (me acuesto, me visto).'],
    ['Reflexive Verben und Tagesablauf', 'Das Pronomen steht vor dem Verb und passt zum Subjekt: me levanto, te levantas, se levanta, nos levantamos, os levantáis, se levantan. Häufig: levantarse, ducharse, vestirse, acostarse, llamarse. Viele mit Stammwechsel (me acuesto, me visto).'],
    ['Povratni glagoli i dnevna rutina', 'Zamenica stoji ispred glagola i slaže se sa subjektom: me levanto, te levantas, se levanta, nos levantamos, os levantáis, se levantan. Česti: levantarse, ducharse, vestirse, acostarse, llamarse. Mnogi menjaju osnovu (me acuesto, me visto).'], [

  gexAdd('es', 'A2', 'es-a2-indef-regular', ['Pretérito indefinido: regular verbs', 'Finished actions at a finished time. -ar: hablé, hablaste, habló, hablamos, hablasteis, hablaron. -er/-ir: comí, comiste, comió, comimos, comisteis, comieron. Spelling changes in yo: -car → qué, -gar → gué, -zar → cé (busqué, pagué, empecé).'],
    ['Pretérito indefinido: правильные глаголы', 'Завершённые действия в завершённое время. -ar: hablé, hablaste, habló, hablamos, hablasteis, hablaron. -er/-ir: comí, comiste, comió, comimos, comisteis, comieron. Орфография в yo: -car → qué, -gar → gué, -zar → cé (busqué, pagué, empecé).'],
    ['Pretérito indefinido: verbos regulares', 'Acciones terminadas en un tiempo terminado. -ar: hablé, hablaste, habló, hablamos, hablasteis, hablaron. -er/-ir: comí, comiste, comió, comimos, comisteis, comieron. Cambios ortográficos en yo: -car → qué, -gar → gué, -zar → cé (busqué, pagué, empecé).'],
    ['Pretérito indefinido: regelmäßige Verben', 'Abgeschlossene Handlungen in abgeschlossener Zeit. -ar: hablé, hablaste, habló, hablamos, hablasteis, hablaron. -er/-ir: comí, comiste, comió, comimos, comisteis, comieron. Schreibung bei yo: -car → qué, -gar → gué, -zar → cé (busqué, pagué, empecé).'],
    ['Pretérito indefinido: pravilni glagoli', 'Završene radnje u završenom vremenu. -ar: hablé, hablaste, habló, hablamos, hablasteis, hablaron. -er/-ir: comí, comiste, comió, comimos, comisteis, comieron. Pravopis kod yo: -car → qué, -gar → gué, -zar → cé (busqué, pagué, empecé).'], [

  gexAdd('es', 'A2', 'es-a2-indef-irregular', ['Pretérito indefinido: irregular verbs', 'Irregular stems with the endings -e, -iste, -o, -imos, -isteis, -ieron: tuve, estuve, pude, puse, supe, quise, vine, hice (hizo), dije (dijeron), traje. Ir and ser: fui, fuiste, fue, fuimos, fuisteis, fueron. Dar: di, diste, dio. Leer: leyó, leyeron. Dormir: durmió, durmieron.'],
    ['Pretérito indefinido: неправильные глаголы', 'Особые основы с окончаниями -e, -iste, -o, -imos, -isteis, -ieron: tuve, estuve, pude, puse, supe, quise, vine, hice (hizo), dije (dijeron), traje. Ir и ser: fui, fuiste, fue, fuimos, fuisteis, fueron. Dar: di, diste, dio. Leer: leyó, leyeron. Dormir: durmió, durmieron.'],
    ['Pretérito indefinido: verbos irregulares', 'Raíces irregulares con las terminaciones -e, -iste, -o, -imos, -isteis, -ieron: tuve, estuve, pude, puse, supe, quise, vine, hice (hizo), dije (dijeron), traje. Ir y ser: fui, fuiste, fue, fuimos, fuisteis, fueron. Dar: di, diste, dio. Leer: leyó, leyeron. Dormir: durmió, durmieron.'],
    ['Pretérito indefinido: unregelmäßige Verben', 'Unregelmäßige Stämme mit den Endungen -e, -iste, -o, -imos, -isteis, -ieron: tuve, estuve, pude, puse, supe, quise, vine, hice (hizo), dije (dijeron), traje. Ir und ser: fui, fuiste, fue, fuimos, fuisteis, fueron. Dar: di, diste, dio. Leer: leyó, leyeron. Dormir: durmió, durmieron.'],
    ['Pretérito indefinido: nepravilni glagoli', 'Nepravilne osnove sa nastavcima -e, -iste, -o, -imos, -isteis, -ieron: tuve, estuve, pude, puse, supe, quise, vine, hice (hizo), dije (dijeron), traje. Ir i ser: fui, fuiste, fue, fuimos, fuisteis, fueron. Dar: di, diste, dio. Leer: leyó, leyeron. Dormir: durmió, durmieron.'], [

  gexAdd('es', 'A2', 'es-a2-imperfecto', ['Pretérito imperfecto', 'Habits, descriptions and ongoing actions in the past. -ar: hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban. -er/-ir: comía, comías, comía, comíamos, comíais, comían. Only three irregulars: ser (era), ir (iba), ver (veía). Time words: siempre, antes, de niño, cada día.'],
    ['Pretérito imperfecto', 'Привычки, описания и длительные действия в прошлом. -ar: hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban. -er/-ir: comía, comías, comía, comíamos, comíais, comían. Всего три исключения: ser (era), ir (iba), ver (veía). Маркеры: siempre, antes, de niño, cada día.'],
    ['Pretérito imperfecto', 'Hábitos, descripciones y acciones en curso en el pasado. -ar: hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban. -er/-ir: comía, comías, comía, comíamos, comíais, comían. Solo tres irregulares: ser (era), ir (iba), ver (veía). Marcadores: siempre, antes, de niño, cada día.'],
    ['Pretérito imperfecto', 'Gewohnheiten, Beschreibungen und andauernde Handlungen in der Vergangenheit. -ar: hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban. -er/-ir: comía, comías, comía, comíamos, comíais, comían. Nur drei Unregelmäßige: ser (era), ir (iba), ver (veía). Signalwörter: siempre, antes, de niño, cada día.'],
    ['Pretérito imperfecto', 'Navike, opisi i radnje u toku u prošlosti. -ar: hablaba, hablabas, hablaba, hablábamos, hablabais, hablaban. -er/-ir: comía, comías, comía, comíamos, comíais, comían. Samo tri nepravilna: ser (era), ir (iba), ver (veía). Oznake: siempre, antes, de niño, cada día.'], [

    'm|Antes yo ___ mucho café.|bebía/bebí/bebo', 'm|De niños, ___ al parque.|íbamos/fuimos/vamos', 'm|Mi padre ___ muy joven entonces.|era/fue/es', 'm|Ellos ___ en el campo.|vivían/vivieron/viven', 'm|Tú siempre ___ chocolate.|comías/comiste/comes', 'm|Yo ___ veinte años entonces.|tenía/tuve/tengo']);
  gexAdd('es', 'A2', 'es-a2-indef-vs-imperf', ['Indefinido vs imperfecto', 'Indefinido: a finished action or event that moves the story forward (Ayer fui al médico). Imperfecto: background, description, habit or an action in progress (Llovía y hacía frío; Mientras cocinaba, sonó el teléfono). The interrupting action is indefinido; the interrupted one is imperfecto.'],
    ['Indefinido и imperfecto', 'Indefinido: завершённое действие или событие, двигающее рассказ (Ayer fui al médico). Imperfecto: фон, описание, привычка или действие в процессе (Llovía y hacía frío; Mientras cocinaba, sonó el teléfono). Прерывающее действие: indefinido; прерванное: imperfecto.'],
    ['Indefinido vs imperfecto', 'Indefinido: acción o hecho terminado que hace avanzar la historia (Ayer fui al médico). Imperfecto: fondo, descripción, hábito o acción en curso (Llovía y hacía frío; Mientras cocinaba, sonó el teléfono). La acción que interrumpe va en indefinido; la interrumpida, en imperfecto.'],
    ['Indefinido und imperfecto', 'Indefinido: abgeschlossene Handlung oder Ereignis, das die Geschichte vorantreibt (Ayer fui al médico). Imperfecto: Hintergrund, Beschreibung, Gewohnheit oder laufende Handlung (Llovía y hacía frío; Mientras cocinaba, sonó el teléfono). Die unterbrechende Handlung steht im indefinido, die unterbrochene im imperfecto.'],
    ['Indefinido i imperfecto', 'Indefinido: završena radnja ili događaj koji pokreće priču (Ayer fui al médico). Imperfecto: pozadina, opis, navika ili radnja u toku (Llovía y hacía frío; Mientras cocinaba, sonó el teléfono). Radnja koja prekida ide u indefinido, prekinuta u imperfecto.'], [
    'g|Ayer ___ (llover) todo el día.|llovió', 'g|Mientras yo ___ (cocinar), sonó el teléfono.|cocinaba', 'g|Cuando llegué, todos ___ (bailar).|bailaban', 'g|Ayer ___ (ir) al médico.|fui', 'g|Cuando era niña, ___ (jugar) en el parque.|jugaba', 'g|Ella ___ (estar) enferma, por eso no vino.|estaba', 'g|Ayer yo ___ (comprar) un coche.|compré',
    'g|Eran las ocho cuando ___ (salir) de casa.|salí', 'g|Hacía frío y ___ (llover) cuando salimos.|llovía', 'g|Yo ___ (ver) la tele cuando él llegó.|veía', 'g|El año pasado ___ (viajar) a Perú.|viajé', 'g|Mientras ___ (esperar) el bus, leí un libro.|esperaba', 'g|De pequeño ___ (vivir) en Madrid.|vivía', 'g|Anoche ___ (cenar) con mis amigos.|cené',
    'm|Ayer ___ al cine.|fui/iba/voy', 'm|Cuando era joven, ___ mucho.|viajaba/viajé/viajo', 'm|Mientras ___, empezó a llover.|caminábamos/caminamos/caminemos', 'm|___ las diez cuando llegó.|Eran/Fueron/Son', 'm|Ayer no ___ al trabajo porque estaba enfermo.|fui/iba/voy', 'm|Ella ___ cuando recibió la noticia.|trabajaba/trabajó/trabaja']);
  gexAdd('es', 'A2', 'es-a2-perfecto', ['Pretérito perfecto', 'haber (he, has, ha, hemos, habéis, han) + past participle (-ado, -ido). Use it for a time that is not finished (hoy, esta semana, este año), experience (¿Alguna vez has estado…?) and recent events. Irregular participles: hecho, dicho, visto, puesto, escrito, abierto, vuelto, roto.'],
    ['Pretérito perfecto', 'haber (he, has, ha, hemos, habéis, han) + причастие (-ado, -ido). Для незавершённого периода (hoy, esta semana, este año), опыта (¿Alguna vez has estado…?) и недавних событий. Неправильные причастия: hecho, dicho, visto, puesto, escrito, abierto, vuelto, roto.'],
    ['Pretérito perfecto', 'haber (he, has, ha, hemos, habéis, han) + participio (-ado, -ido). Se usa con un tiempo no terminado (hoy, esta semana, este año), experiencia (¿Alguna vez has estado…?) y hechos recientes. Participios irregulares: hecho, dicho, visto, puesto, escrito, abierto, vuelto, roto.'],
    ['Pretérito perfecto', 'haber (he, has, ha, hemos, habéis, han) + Partizip (-ado, -ido). Für nicht abgeschlossene Zeiträume (hoy, esta semana, este año), Erfahrung (¿Alguna vez has estado…?) und Aktuelles. Unregelmäßige Partizipien: hecho, dicho, visto, puesto, escrito, abierto, vuelto, roto.'],
    ['Pretérito perfecto', 'haber (he, has, ha, hemos, habéis, han) + particip (-ado, -ido). Za nezavršeno vreme (hoy, esta semana, este año), iskustvo (¿Alguna vez has estado…?) i skorašnje događaje. Nepravilni participi: hecho, dicho, visto, puesto, escrito, abierto, vuelto, roto.'], [
    'g|Hoy yo ___ (comer) pizza.|he comido', 'g|Tú ___ (hablar) con ella.|has hablado', 'g|Ella ___ (llegar) tarde.|ha llegado', 'g|Nosotros ___ (vivir) aquí diez años.|hemos vivido', 'g|Vosotros ___ (hacer) los deberes.|habéis hecho', 'g|Ellos ___ (ver) esa película.|han visto', 'g|Yo nunca ___ (estar) en Perú.|he estado',
    'g|¿___ (tú / decir) la verdad?|Has dicho', 'g|Esta semana ___ (yo / escribir) tres cartas.|he escrito', 'g|Ella ya ___ (abrir) la puerta.|ha abierto', 'g|¿Alguna vez ___ (tú / probar) el sushi?|has probado', 'g|Hoy nosotros ___ (poner) la mesa.|hemos puesto', 'g|Este año ellos ___ (volver) a Cuba.|han vuelto', 'g|Todavía no ___ (yo / ver) a Ana.|he visto',
    'm|Esta mañana ___ café.|he tomado/tomaba/tomando', 'm|Ellos ya ___ la cena.|han hecho/hacen/hacido', 'm|Nunca ___ en avión. (yo)|he viajado/viajado/he viajo', 'm|¿Qué ___ hoy? (tú, hacer)|has hecho/has hacido/hacías', 'm|Este verano ___ a Italia.|hemos ido/habemos ido/hemos idos', 'm|Ella ___ muchos libros este año.|ha leído/ha leyó/ha leer']);
  gexAdd('es', 'A2', 'es-a2-futuro', ['Ir a + infinitive and the simple future', 'Ir a + infinitive: plans and what is about to happen (Voy a viajar). Simple future: infinitive + é, ás, á, emos, éis, án (hablaré); predictions and promises. Irregular stems: tendr-, vendr-, podr-, sabr-, pondr-, saldr-, har-, dir-, habr-, querr-.'],
    ['Ir a + инфинитив и простое будущее', 'Ir a + инфинитив: планы и то, что скоро случится (Voy a viajar). Простое будущее: инфинитив + é, ás, á, emos, éis, án (hablaré); предсказания и обещания. Особые основы: tendr-, vendr-, podr-, sabr-, pondr-, saldr-, har-, dir-, habr-, querr-.'],
    ['Ir a + infinitivo y futuro simple', 'Ir a + infinitivo: planes y lo que va a pasar (Voy a viajar). Futuro simple: infinitivo + é, ás, á, emos, éis, án (hablaré); predicciones y promesas. Raíces irregulares: tendr-, vendr-, podr-, sabr-, pondr-, saldr-, har-, dir-, habr-, querr-.'],
    ['Ir a + Infinitiv und einfaches Futur', 'Ir a + Infinitiv: Pläne und Bevorstehendes (Voy a viajar). Futur: Infinitiv + é, ás, á, emos, éis, án (hablaré); Vorhersagen und Versprechen. Unregelmäßige Stämme: tendr-, vendr-, podr-, sabr-, pondr-, saldr-, har-, dir-, habr-, querr-.'],
    ['Ir a + infinitiv i prosto buduće vreme', 'Ir a + infinitiv: planovi i ono što uskoro sledi (Voy a viajar). Futur: infinitiv + é, ás, á, emos, éis, án (hablaré); predviđanja i obećanja. Nepravilne osnove: tendr-, vendr-, podr-, sabr-, pondr-, saldr-, har-, dir-, habr-, querr-.'], [

  gexAdd('es', 'A2', 'es-a2-object-pronouns', ['Direct and indirect object pronouns', 'Direct: me, te, lo/la, nos, os, los/las (¿Ves el libro? Sí, lo veo). Indirect: me, te, le, nos, os, les (Le doy el regalo a mi madre). They go before a conjugated verb or attach to an infinitive or gerund (Voy a verlo).'],
    ['Прямое и косвенное дополнение', 'Прямое: me, te, lo/la, nos, os, los/las (¿Ves el libro? Sí, lo veo). Косвенное: me, te, le, nos, os, les (Le doy el regalo a mi madre). Стоят перед спряжённым глаголом или присоединяются к инфинитиву и герундию (Voy a verlo).'],
    ['Pronombres de objeto directo e indirecto', 'Directo: me, te, lo/la, nos, os, los/las (¿Ves el libro? Sí, lo veo). Indirecto: me, te, le, nos, os, les (Le doy el regalo a mi madre). Van antes del verbo conjugado o se unen al infinitivo y al gerundio (Voy a verlo).'],
    ['Direkte und indirekte Objektpronomen', 'Direkt: me, te, lo/la, nos, os, los/las (¿Ves el libro? Sí, lo veo). Indirekt: me, te, le, nos, os, les (Le doy el regalo a mi madre). Sie stehen vor dem konjugierten Verb oder hängen am Infinitiv und Gerundium (Voy a verlo).'],
    ['Direktni i indirektni objekat', 'Direktni: me, te, lo/la, nos, os, los/las (¿Ves el libro? Sí, lo veo). Indirektni: me, te, le, nos, os, les (Le doy el regalo a mi madre). Stoje ispred konjugovanog glagola ili se spajaju s infinitivom i gerundom (Voy a verlo).'], [
    'g|¿Ves el libro? Sí, ___ veo.|lo', 'g|¿Compras la casa? Sí, ___ compro.|la', 'g|¿Conoces a mis padres? Sí, ___ conozco.|los', 'g|¿Tienes las llaves? Sí, ___ tengo.|las', 'g|Quiero comprar el libro. = ___ quiero comprar.|Lo', 'g|Doy el regalo a mi madre. ___ doy el regalo.|Le', 'g|¿Me puedes ayudar? Sí, ___ puedo ayudar. (a ti)|te',

    'm|¿Ves a María? Sí, ___ veo.|la/lo/le', 'm|Doy flores a mi madre. ___ doy flores.|Le/La/Lo', 'm|Ella ___ llama a menudo. (a mí)|me/te/le', 'm|¿Tienes los billetes? Sí, ___ tengo.|los/las/les', 'm|Nunca ___ digo nada a mis padres.|les/los/lo', 'm|¿Dónde están las llaves? No ___ encuentro.|las/los/le']);
  gexAdd('es', 'A2', 'es-a2-comparatives', ['Comparatives and superlatives', 'más / menos + adjective + que (más alto que yo). Equality: tan + adjective + como; tanto/a/os/as + noun + como. Superlative: el/la más + adjective (el más alto de la clase). Irregular: mejor, peor, mayor, menor; no más bueno.'],
    ['Сравнительная и превосходная степень', 'más / menos + прилагательное + que (más alto que yo). Равенство: tan + прилагательное + como; tanto/a/os/as + существительное + como. Превосходная: el/la más + прилагательное (el más alto de la clase). Исключения: mejor, peor, mayor, menor; нельзя más bueno.'],
    ['Comparativos y superlativos', 'más / menos + adjetivo + que (más alto que yo). Igualdad: tan + adjetivo + como; tanto/a/os/as + sustantivo + como. Superlativo: el/la más + adjetivo (el más alto de la clase). Irregulares: mejor, peor, mayor, menor; no más bueno.'],
    ['Komparativ und Superlativ', 'más / menos + Adjektiv + que (más alto que yo). Gleichheit: tan + Adjektiv + como; tanto/a/os/as + Nomen + como. Superlativ: el/la más + Adjektiv (el más alto de la clase). Unregelmäßig: mejor, peor, mayor, menor; nicht más bueno.'],
    ['Komparativ i superlativ', 'más / menos + pridev + que (más alto que yo). Jednakost: tan + pridev + como; tanto/a/os/as + imenica + como. Superlativ: el/la más + pridev (el más alto de la clase). Nepravilni: mejor, peor, mayor, menor; ne más bueno.'], [
    'g|Mi hermano es ___ alto que yo.|más', 'g|Este libro es ___ interesante que ese.|más', 'g|Ella es tan inteligente ___ él.|como', 'g|Madrid es ___ grande que Sevilla.|más', 'g|Mi coche es ___ que el tuyo. (bueno)|mejor', 'g|Esta película es ___ que la otra. (mala)|peor', 'g|Hoy hace ___ calor que ayer. (not as much)|menos',
    'g|Es el ___ alto de la clase.|más', 'g|Es la ciudad ___ bonita del país.|más', 'g|Ella es la ___ de mis hermanas. (buena)|mejor', 'g|Mi hermano es ___ que yo. (older)|mayor', 'g|Él es el ___ de la familia. (youngest)|menor', 'g|Comes tanto ___ yo.|como', 'g|Mis notas son ___ buenas como las tuyas.|tan',
    'm|Él es ___ que su hermano.|más alto/alto más/más alta', 'm|Esta casa es ___ cara que aquella.|más/mas/muy', 'm|Mi ordenador es ___ que el tuyo.|mejor/más bueno/más mejor', 'm|Es el restaurante ___ barato de la ciudad.|más/muy/tan', 'm|Tengo ___ amigos que tú.|más/mejor/muy', 'm|Ella corre ___ rápido como yo.|tan/más/tanto']);
  gexAdd('es', 'A2', 'es-a2-imperativo', ['Affirmative imperative', 'Tú: the same as the he/she form of the present (habla, come, abre). Irregular tú: di, haz, ve, pon, sal, sé, ten, ven. Usted: the subjunctive form (hable, coma, abra). Vosotros: replace the -r of the infinitive with -d (hablad, comed, abrid). Pronouns attach to the end: dime, siéntate.'],
    ['Утвердительный императив', 'Tú: как форма he/she настоящего времени (habla, come, abre). Особые tú: di, haz, ve, pon, sal, sé, ten, ven. Usted: форма сослагательного (hable, coma, abra). Vosotros: замените -r инфинитива на -d (hablad, comed, abrid). Местоимения присоединяются: dime, siéntate.'],
    ['Imperativo afirmativo', 'Tú: igual que la forma él/ella del presente (habla, come, abre). Tú irregular: di, haz, ve, pon, sal, sé, ten, ven. Usted: forma del subjuntivo (hable, coma, abra). Vosotros: cambia la -r del infinitivo por -d (hablad, comed, abrid). Los pronombres se unen al final: dime, siéntate.'],
    ['Bejahter Imperativ', 'Tú: wie die er/sie-Form im Präsens (habla, come, abre). Unregelmäßig bei tú: di, haz, ve, pon, sal, sé, ten, ven. Usted: Subjuntivo-Form (hable, coma, abra). Vosotros: -r des Infinitivs durch -d ersetzen (hablad, comed, abrid). Pronomen werden angehängt: dime, siéntate.'],
    ['Potvrdni imperativ', 'Tú: isto kao oblik él/ella u prezentu (habla, come, abre). Nepravilni tú: di, haz, ve, pon, sal, sé, ten, ven. Usted: oblik subjunktiva (hable, coma, abra). Vosotros: -r infinitiva zameni sa -d (hablad, comed, abrid). Zamenice se dodaju na kraj: dime, siéntate.'], [
    'g|___ (hablar, tú) más despacio.|Habla', 'g|___ (comer, tú) la sopa.|Come', 'g|___ (abrir, tú) la ventana.|Abre', 'g|___ (escribir, usted) su nombre.|Escriba', 'g|___ (venir, tú) aquí.|Ven', 'g|___ (hacer, tú) los deberes.|Haz', 'g|___ (decir, tú) la verdad.|Di',
    'g|___ (ir, tú) a casa.|Ve', 'g|___ (poner, tú) la mesa.|Pon', 'g|___ (salir, tú) de aquí.|Sal', 'g|___ (tener, tú) cuidado.|Ten', 'g|___ (ser, tú) amable.|Sé', 'g|___ (escuchar, vosotros) con atención.|Escuchad', 'g|___ (leer, usted) este texto.|Lea',
    'm|___ la puerta, por favor. (tú, cerrar)|Cierra/Cerra/Cierre', 'm|___ aquí, por favor. (usted, esperar)|Espere/Espera/Esperas', 'm|___ más agua. (tú, beber)|Bebe/Bebes/Beba', 'm|___ a la derecha. (tú, girar)|Gira/Giras/Gire', 'm|___ conmigo. (tú, venir)|Ven/Viene/Vienes', 'm|___ la verdad. (vosotros, decir)|Decid/Decís/Dicen']);
  gexAdd('es', 'A2', 'es-a2-por-para', ['Por vs para', 'Para: purpose (Estudio para trabajar), destination (Salgo para Madrid), deadline (para el lunes), recipient (un regalo para ti), comparison. Por: cause (Gracias por tu ayuda), exchange or price (por diez euros), movement through a place (paseo por el parque), duration, means (por teléfono), part of the day (por la mañana).'],
    ['Por и para', 'Para: цель (Estudio para trabajar), направление (Salgo para Madrid), срок (para el lunes), адресат (un regalo para ti), сравнение. Por: причина (Gracias por tu ayuda), обмен или цена (por diez euros), движение по месту (paseo por el parque), длительность, средство (por teléfono), часть суток (por la mañana).'],
    ['Por vs para', 'Para: finalidad (Estudio para trabajar), destino (Salgo para Madrid), plazo (para el lunes), destinatario (un regalo para ti), comparación. Por: causa (Gracias por tu ayuda), cambio o precio (por diez euros), movimiento por un lugar (paseo por el parque), duración, medio (por teléfono), parte del día (por la mañana).'],
    ['Por und para', 'Para: Zweck (Estudio para trabajar), Ziel (Salgo para Madrid), Frist (para el lunes), Empfänger (un regalo para ti), Vergleich. Por: Grund (Gracias por tu ayuda), Tausch oder Preis (por diez euros), Bewegung durch einen Ort (paseo por el parque), Dauer, Mittel (por teléfono), Tageszeit (por la mañana).'],
    ['Por i para', 'Para: svrha (Estudio para trabajar), odredište (Salgo para Madrid), rok (para el lunes), primalac (un regalo para ti), poređenje. Por: uzrok (Gracias por tu ayuda), zamena ili cena (por diez euros), kretanje kroz mesto (paseo por el parque), trajanje, sredstvo (por teléfono), deo dana (por la mañana).'], [
    'g|Este regalo es ___ ti.|para', 'g|Gracias ___ tu ayuda.|por', 'g|Estudio español ___ trabajar en España.|para', 'g|Paseamos ___ el parque.|por', 'g|Salgo ___ Madrid mañana. (destination)|para', 'g|Trabajo ___ una empresa grande.|para', 'g|Lo compré ___ diez euros.|por',
    'g|Te llamo ___ teléfono.|por', 'g|Es muy alto ___ su edad.|para', 'g|Voy a la tienda ___ pan. (to get)|por', 'g|Necesito el informe ___ el lunes.|para', 'g|Viajo ___ trabajo. (reason)|por', 'g|Estuve en Madrid ___ una semana.|por/durante', 'g|Vamos ___ la mañana al mercado.|por',
    'm|¿Esto es ___ mí?|para/por/de', 'm|Lo hago ___ ti. (because of you)|por/para/en', 'm|Estudio ___ ser médico.|para/por/de', 'm|Gracias ___ venir.|por/para/de', 'm|Pasamos ___ Valencia.|por/para/en', 'm|Compré flores ___ mi madre.|para/por/de']);
