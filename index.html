  gexAdd('es', 'B1', 'es-b1-pluscuamperfecto', ['Pluscuamperfecto', 'haber in the imperfect (había, habías, había, habíamos, habíais, habían) + past participle. It describes an action that happened before another past action or moment: Cuando llegué, ella ya había salido. Reflexive pronouns stay before haber: me había acostado.'],
    ['Pluscuamperfecto', 'haber в imperfecto (había, habías, había, habíamos, habíais, habían) + причастие. Действие, которое произошло раньше другого прошлого действия или момента: Cuando llegué, ella ya había salido. Возвратное местоимение перед haber: me había acostado.'],
    ['Pretérito pluscuamperfecto', 'haber en imperfecto (había, habías, había, habíamos, habíais, habían) + participio. Expresa una acción anterior a otra acción o momento pasado: Cuando llegué, ella ya había salido. El pronombre reflexivo va antes de haber: me había acostado.'],
    ['Plusquamperfekt', 'haber im Imperfecto (había, habías, había, habíamos, habíais, habían) + Partizip. Beschreibt eine Handlung vor einer anderen vergangenen Handlung oder einem Zeitpunkt: Cuando llegué, ella ya había salido. Das Reflexivpronomen steht vor haber: me había acostado.'],
    ['Pluskvamperfekat', 'haber u imperfektu (había, habías, había, habíamos, habíais, habían) + particip. Radnja koja se desila pre druge prošle radnje ili trenutka: Cuando llegué, ella ya había salido. Povratna zamenica stoji ispred haber: me había acostado.'], [
    'g|Cuando llegué, ella ya ___ (salir).|había salido', 'g|Nosotros ya ___ (comer).|habíamos comido', 'g|Yo nunca ___ (ver) el mar.|había visto', 'g|¿Tú ya ___ (leer) el libro?|habías leído', 'g|Ellos ___ (hacer) los deberes.|habían hecho', 'g|Ella ___ (decir) la verdad.|había dicho', 'g|Vosotros ___ (llegar) antes.|habíais llegado',
    'g|Yo ___ (escribir) la carta.|había escrito', 'g|Nosotros nunca ___ (estar) allí antes.|habíamos estado', 'g|Cuando llamó, yo ya ___ (acostarse).|me había acostado', 'g|Ellos no ___ (volver) todavía.|habían vuelto', 'g|Ella ___ (romper) el vaso.|había roto', 'g|No sabía que tú ___ (venir).|habías venido', 'g|Antes de cenar, yo ya ___ (ducharse).|me había duchado',
    'm|Cuando llegué, ellos ya ___.|habían comido/han comido/comieron', 'm|Yo no ___ nunca ese plato.|había probado/he probado/probé', 'm|¿___ vosotros visto esa película?|Habíais/Habéis/Habían', 'm|Ella ya ___ cuando salí.|había salido/ha salido/salió', 'm|Me dijo que ___ su casa.|había vendido/ha vendido/vendió', 'm|Nosotros ___ ya la cena.|habíamos preparado/hemos preparado/preparamos']);
  gexAdd('es', 'B1', 'es-b1-futuro-condicional', ['Simple future and conditional', 'Future: infinitive + é, ás, á, emos, éis, án (iré). Also guesses about the present: Estará durmiendo. Conditional: infinitive + ía, ías, ía, íamos, íais, ían (iría); polite requests (¿Podría ayudarme?), advice (Yo en tu lugar hablaría) and the future in the past (Dijo que vendría). Same irregular stems for both.'],
    ['Простое будущее и условное наклонение', 'Будущее: инфинитив + é, ás, á, emos, éis, án (iré). Также предположение о настоящем: Estará durmiendo. Condicional: инфинитив + ía, ías, ía, íamos, íais, ían (iría); вежливая просьба (¿Podría ayudarme?), совет (Yo en tu lugar hablaría) и будущее в прошедшем (Dijo que vendría). Основы-исключения одни и те же.'],
    ['Futuro simple y condicional', 'Futuro: infinitivo + é, ás, á, emos, éis, án (iré). También suposición sobre el presente: Estará durmiendo. Condicional: infinitivo + ía, ías, ía, íamos, íais, ían (iría); peticiones corteses (¿Podría ayudarme?), consejos (Yo en tu lugar hablaría) y futuro del pasado (Dijo que vendría). Las raíces irregulares son las mismas.'],
    ['Futur und Konditional', 'Futur: Infinitiv + é, ás, á, emos, éis, án (iré). Auch Vermutung über die Gegenwart: Estará durmiendo. Condicional: Infinitiv + ía, ías, ía, íamos, íais, ían (iría); höfliche Bitten (¿Podría ayudarme?), Ratschläge (Yo en tu lugar hablaría) und Zukunft in der Vergangenheit (Dijo que vendría). Gleiche unregelmäßige Stämme.'],
    ['Futur i kondicional', 'Futur: infinitiv + é, ás, á, emos, éis, án (iré). Takođe pretpostavka o sadašnjosti: Estará durmiendo. Kondicional: infinitiv + ía, ías, ía, íamos, íais, ían (iría); učtivi zahtevi (¿Podría ayudarme?), saveti (Yo en tu lugar hablaría) i budućnost u prošlosti (Dijo que vendría). Iste nepravilne osnove.'], [
    'g|Mañana ___ (llover).|lloverá', 'g|Yo ___ (viajar) a España el año próximo.|viajaré', 'g|¿Dónde ___ (estar) Pedro? (I wonder)|estará', 'g|No contesta. ___ (estar) durmiendo.|Estará', 'g|Yo ___ (comprar) esa casa si tuviera dinero.|compraría', 'g|¿Me ___ (poder) ayudar, por favor?|podría', 'g|Nosotros ___ (viajar) más si pudiéramos.|viajaríamos',
    'g|Ella dijo que ___ (venir) mañana.|vendría', 'g|Yo en tu lugar ___ (hablar) con él.|hablaría', 'g|¿___ (tú / querer) un café?|Querrías', 'g|¿Qué ___ (tú / hacer) en mi lugar?|harías', 'g|Dijo que ___ (hacer) la cena.|haría', 'g|Mi hermano ___ (llegar) a las ocho.|llegará', 'g|Nosotros ___ (salir) a las ocho.|saldremos',
    'm|Si tengo tiempo, te ___.|llamaré/llamaría/llamo', 'm|Yo ___ vivir en el campo.|viviría/viviré/vivo', 'm|¿Qué hora ___? (probably)|será/sería/es', 'm|Me ___ visitar Japón.|gustaría/gustará/gusto', 'm|¿___ cerrar la ventana?|Podría/Pueda/Poder', 'm|Dijeron que no ___ tarde.|llegarían/llegarán/llegan']);
  gexAdd('es', 'B1', 'es-b1-subj-wishes', ['Present subjunctive: wishes and emotions', 'Regular: -ar verbs take -e endings (hable), -er/-ir verbs take -a endings (coma, viva). Use it after wishes, requests and feelings when the subject changes: Quiero que vengas. Espero que llegue. Me alegro de que estés bien. Ojalá llueva. Same subject → infinitive: Quiero venir.'],
    ['Presente de subjuntivo: желания и эмоции', 'Правильные: -ar → окончания на -e (hable), -er/-ir → окончания на -a (coma, viva). После желаний, просьб и чувств, когда подлежащее меняется: Quiero que vengas. Espero que llegue. Me alegro de que estés bien. Ojalá llueva. То же подлежащее → инфинитив: Quiero venir.'],
    ['Presente de subjuntivo: deseos y emociones', 'Regulares: los verbos en -ar toman -e (hable), los en -er/-ir toman -a (coma, viva). Se usa tras deseos, peticiones y emociones cuando cambia el sujeto: Quiero que vengas. Espero que llegue. Me alegro de que estés bien. Ojalá llueva. Mismo sujeto → infinitivo: Quiero venir.'],
    ['Präsens Subjuntivo: Wünsche und Gefühle', 'Regelmäßig: -ar-Verben bekommen -e (hable), -er/-ir-Verben -a (coma, viva). Nach Wünschen, Bitten und Gefühlen bei wechselndem Subjekt: Quiero que vengas. Espero que llegue. Me alegro de que estés bien. Ojalá llueva. Gleiches Subjekt → Infinitiv: Quiero venir.'],
    ['Prezent subjunktiva: želje i emocije', 'Pravilni: glagoli na -ar dobijaju -e (hable), na -er/-ir dobijaju -a (coma, viva). Posle želja, molbi i osećanja kad se subjekat menja: Quiero que vengas. Espero que llegue. Me alegro de que estés bien. Ojalá llueva. Isti subjekat → infinitiv: Quiero venir.'], [
    'g|Quiero que tú ___ (venir).|vengas', 'g|Espero que ella ___ (llegar) pronto.|llegue', 'g|Me alegro de que ___ (tú / estar) bien.|estés', 'g|Ojalá ___ (llover) mañana.|llueva', 'g|Es importante que nosotros ___ (estudiar).|estudiemos', 'g|Quiero que ellos ___ (ser) felices.|sean', 'g|Mi madre quiere que yo ___ (comer) más.|coma',
    'g|Te pido que ___ (hacer) silencio.|hagas', 'g|Espero que vosotros ___ (poder) venir.|podáis', 'g|Me gusta que ___ (tú / decir) la verdad.|digas', 'g|Ojalá que ___ (ganar) nuestro equipo.|gane', 'g|Siento que ___ (ella / estar) enferma.|esté', 'g|Quiero que me ___ (tú / llamar) hoy.|llames', 'g|Me encanta que ellos ___ (venir).|vengan',
    'm|Quiero que ___ aquí. (tú)|vengas/vienes/venir', 'm|Espero que ___ buen tiempo.|haga/hace/hacer', 'm|Es mejor que nosotros ___ ahora.|salgamos/salimos/salir', 'm|Me alegro de que ___ contento. (tú)|estés/estás/estar', 'm|Ojalá ___ suerte mañana. (tú)|tengas/tienes/tener', 'm|Quiero que ___ la puerta. (tú)|cierres/cierras/cerrar']);
  gexAdd('es', 'B1', 'es-b1-subj-doubt', ['Subjunctive: doubt and opinion', 'Subjunctive when you doubt, deny or give a possibility: No creo que venga. Dudo que sepan. Es posible que llueva. Puede que llegue tarde. Indicative when you affirm: Creo que tiene razón. Es verdad que trabaja mucho. Está claro que quieren ganar.'],
    ['Subjuntivo: сомнение и мнение', 'Subjuntivo при сомнении, отрицании и возможности: No creo que venga. Dudo que sepan. Es posible que llueva. Puede que llegue tarde. Индикатив при утверждении: Creo que tiene razón. Es verdad que trabaja mucho. Está claro que quieren ganar.'],
    ['Subjuntivo: duda y opinión', 'Subjuntivo cuando dudas, niegas o expresas posibilidad: No creo que venga. Dudo que sepan. Es posible que llueva. Puede que llegue tarde. Indicativo cuando afirmas: Creo que tiene razón. Es verdad que trabaja mucho. Está claro que quieren ganar.'],
    ['Subjuntivo: Zweifel und Meinung', 'Subjuntivo bei Zweifel, Verneinung und Möglichkeit: No creo que venga. Dudo que sepan. Es posible que llueva. Puede que llegue tarde. Indikativ bei Bestätigung: Creo que tiene razón. Es verdad que trabaja mucho. Está claro que quieren ganar.'],
    ['Subjunktiv: sumnja i mišljenje', 'Subjunktiv kod sumnje, negacije i mogućnosti: No creo que venga. Dudo que sepan. Es posible que llueva. Puede que llegue tarde. Indikativ kod tvrdnje: Creo que tiene razón. Es verdad que trabaja mucho. Está claro que quieren ganar.'], [
    'g|No creo que ella ___ (venir).|venga', 'g|Dudo que ellos ___ (saber) la respuesta.|sepan', 'g|Creo que él ___ (tener) razón.|tiene', 'g|No pienso que ___ (ser) fácil.|sea', 'g|Es posible que ___ (llover) hoy.|llueva', 'g|Es verdad que ella ___ (trabajar) mucho.|trabaja', 'g|Dudo que nosotros ___ (poder) llegar.|podamos',
    'g|No es cierto que ___ (tú / tener) razón.|tengas', 'g|Creo que ellos ___ (estar) en casa.|están', 'g|Es probable que ___ (nevar) mañana.|nieve', 'g|No creo que ___ (ser) verdad.|sea', 'g|Está claro que ellos ___ (querer) ganar.|quieren', 'g|Puede que yo ___ (llegar) tarde.|llegue', 'g|No me parece que ___ (haber) problema.|haya',
    'm|Creo que ella ___ pronto.|llegará/llegue/llegara', 'm|No creo que ___ razón.|tenga/tiene/tendrá', 'm|Dudo que ___ hoy.|venga/viene/vendrá', 'm|Es evidente que él ___ mal.|está/esté/estar', 'm|Es posible que nosotros ___.|ganemos/ganamos/ganar', 'm|No es verdad que ellos ___ mintiendo.|estén/están/son']);
  gexAdd('es', 'B1', 'es-b1-temporales', ['Time clauses (cuando, antes de que, en cuanto)', 'Talking about the future, use the subjunctive after cuando, en cuanto, tan pronto como, hasta que, después de que, mientras: Te llamo cuando llegue. Habits and the past take the indicative: Cuando llego, ceno. Antes de que always takes the subjunctive. Same subject: antes de + infinitive.'],
    ['Придаточные времени (cuando, antes de que, en cuanto)', 'Если речь о будущем, после cuando, en cuanto, tan pronto como, hasta que, después de que, mientras ставится subjuntivo: Te llamo cuando llegue. Привычки и прошлое: индикатив: Cuando llego, ceno. Antes de que всегда с subjuntivo. То же подлежащее: antes de + инфинитив.'],
    ['Oraciones temporales (cuando, antes de que, en cuanto)', 'Si hablas del futuro, usa subjuntivo tras cuando, en cuanto, tan pronto como, hasta que, después de que, mientras: Te llamo cuando llegue. Hábitos y pasado llevan indicativo: Cuando llego, ceno. Antes de que siempre lleva subjuntivo. Mismo sujeto: antes de + infinitivo.'],
    ['Temporalsätze (cuando, antes de que, en cuanto)', 'Bei Zukunftsbezug steht der Subjuntivo nach cuando, en cuanto, tan pronto como, hasta que, después de que, mientras: Te llamo cuando llegue. Gewohnheit und Vergangenheit: Indikativ: Cuando llego, ceno. Antes de que immer mit Subjuntivo. Gleiches Subjekt: antes de + Infinitiv.'],
    ['Vremenske rečenice (cuando, antes de que, en cuanto)', 'Kad se govori o budućnosti, posle cuando, en cuanto, tan pronto como, hasta que, después de que, mientras ide subjunktiv: Te llamo cuando llegue. Navike i prošlost: indikativ: Cuando llego, ceno. Antes de que uvek traži subjunktiv. Isti subjekat: antes de + infinitiv.'], [
    'g|Cuando ___ (yo / llegar), te llamo. (future)|llegue', 'g|Te llamaré en cuanto ___ (saber) algo.|sepa', 'g|Cuando era niño, ___ (yo / jugar) mucho.|jugaba', 'g|Cuando ___ (nosotros / llegar) a casa, cenaremos.|lleguemos', 'g|Antes de que ___ (tú / salir), llámame.|salgas', 'g|Después de que ___ (ellos / comer), salieron.|comieron', 'g|Hasta que no ___ (tú / terminar), no sales.|termines',
    'g|Siempre que ___ (yo / ir) al cine, compro palomitas.|voy', 'g|Mientras ___ (yo / cocinar), tú pones la mesa.|cocino/cocine', 'g|Tan pronto como ___ (ella / llegar), empezamos.|llegue', 'g|Cuando ___ (ella / venir) ayer, estaba cansada.|vino', 'g|Llámame cuando ___ (tú / llegar).|llegues', 'g|Voy a esperar hasta que ___ (ellos / venir).|vengan', 'g|Antes de ___ (comer), me lavo las manos.|comer',
    'm|Cuando ___ a Madrid, te visitaré.|vaya/voy/iré', 'm|Después de que ___, nos fuimos.|cenamos/cenemos/cenar', 'm|Antes de que ___, ordena tu cuarto. (tú)|salgas/sales/salir', 'm|Cuando ___ niño, vivía en Cádiz.|era/sea/fuera', 'm|Te lo diré en cuanto lo ___.|sepa/sé/sabré', 'm|Siempre que ___ frío, me pongo un abrigo.|hace/haga/hará']);
  gexAdd('es', 'B1', 'es-b1-imperativo-neg', ['Negative imperative and imperative with pronouns', 'Negative commands use the subjunctive: no hables, no comas, no abra, no vayas, no hagas, no pongáis. Pronouns go before the verb in the negative (no lo hagas) but attach to the end in the affirmative (hazlo, dime, siéntate); an accent keeps the stress.'],
    ['Отрицательный императив и императив с местоимениями', 'Запрет выражается формой subjuntivo: no hables, no comas, no abra, no vayas, no hagas, no pongáis. Местоимения в отрицании перед глаголом (no lo hagas), в утверждении в конце (hazlo, dime, siéntate); ударение сохраняется с помощью акцента.'],
    ['Imperativo negativo e imperativo con pronombres', 'El imperativo negativo usa el subjuntivo: no hables, no comas, no abra, no vayas, no hagas, no pongáis. Los pronombres van antes del verbo en negativo (no lo hagas) y al final en afirmativo (hazlo, dime, siéntate); la tilde mantiene el acento.'],
    ['Verneinter Imperativ und Imperativ mit Pronomen', 'Der verneinte Imperativ nutzt den Subjuntivo: no hables, no comas, no abra, no vayas, no hagas, no pongáis. Pronomen stehen in der Verneinung vor dem Verb (no lo hagas), bejaht am Ende (hazlo, dime, siéntate); der Akzent erhält die Betonung.'],
    ['Negativni imperativ i imperativ sa zamenicama', 'Negativni imperativ koristi subjunktiv: no hables, no comas, no abra, no vayas, no hagas, no pongáis. Zamenice stoje ispred glagola u odrici (no lo hagas), a na kraju u potvrdi (hazlo, dime, siéntate); akcent čuva naglasak.'], [
    'g|No ___ (hablar, tú) tan rápido.|hables', 'g|No ___ (comer, tú) eso.|comas', 'g|No ___ (abrir, usted) la puerta.|abra', 'g|No ___ (hacer, tú) ruido.|hagas', 'g|No ___ (decir, tú) nada.|digas', 'g|No ___ (ir, tú) allí.|vayas', 'g|No ___ (poner, vosotros) eso aquí.|pongáis',
    'g|No ___ (salir, tú) sin abrigo.|salgas', 'g|No ___ (ser, tú) tonto.|seas', 'g|___ (levantarse, tú), es tarde.|Levántate', 'g|No te ___ (preocupar, tú).|preocupes', 'g|No ___ (tocar, tú) eso.|toques', 'g|No ___ (tener, tú) miedo.|tengas', 'g|___ (decir + me, tú) la verdad.|Dime',
    'm|No ___ tan tarde. (tú, llegar)|llegues/llegas/llega', 'm|No ___ el coche aquí. (usted, aparcar)|aparque/aparca/aparques', 'm|No ___ eso. (vosotros, hacer)|hagáis/hacéis/hagan', 'm|¡___! (tú, callarse)|Cállate/Calla te/Callarte', 'm|No me ___. (tú, mentir)|mientas/mientes/mienta', 'm|No ___ miedo. (tú, tener)|tengas/tienes/ten']);
  gexAdd('es', 'B1', 'es-b1-double-pron', ['Double object pronouns', 'Order: indirect first, then direct (me lo, te la, nos los). With le/les + lo/la/los/las, le/les becomes se: Se lo doy (not le lo). They go before the verb or attach to an infinitive, gerund or affirmative command, with an accent: Voy a dárselo, dímelo.'],
    ['Двойные местоимения-дополнения', 'Порядок: сначала косвенное, потом прямое (me lo, te la, nos los). Le/les перед lo/la/los/las превращаются в se: Se lo doy (не le lo). Стоят перед глаголом или присоединяются к инфинитиву, герундию и утвердительному императиву с акцентом: Voy a dárselo, dímelo.'],
    ['Pronombres dobles', 'Orden: primero el indirecto, luego el directo (me lo, te la, nos los). Le/les ante lo/la/los/las pasan a se: Se lo doy (no le lo). Van antes del verbo o se unen al infinitivo, gerundio o imperativo afirmativo, con tilde: Voy a dárselo, dímelo.'],
    ['Doppelte Objektpronomen', 'Reihenfolge: erst indirekt, dann direkt (me lo, te la, nos los). Le/les vor lo/la/los/las wird zu se: Se lo doy (nicht le lo). Sie stehen vor dem Verb oder hängen an Infinitiv, Gerundium und bejahtem Imperativ, mit Akzent: Voy a dárselo, dímelo.'],
    ['Dvostruke zamenice u objektu', 'Redosled: prvo indirektni, pa direktni (me lo, te la, nos los). Le/les ispred lo/la/los/las postaje se: Se lo doy (ne le lo). Stoje ispred glagola ili se spajaju s infinitivom, gerundom i potvrdnim imperativom, uz akcent: Voy a dárselo, dímelo.'], [
    'g|¿Me das el libro? Sí, ___ doy.|te lo', 'g|¿Le das la carta a María? Sí, ___ doy.|se la', 'g|¿Quién te dio el regalo? Mi tío ___ dio.|me lo', 'g|¿Les explicas la lección a los niños? Sí, ___ explico.|se la', 'g|Le escribo una carta a mi madre. = ___ escribo.|Se la', 'g|¿Me prestas tu coche? Sí, ___ presto.|te lo', 'g|Voy a ___ el libro a Pedro. (dar + se + lo)|dárselo',
    'g|¿Les compraste los billetes? Sí, ___ compré.|se los', 'g|Dime la verdad. = ___ (decir + me + la).|Dímela', 'g|¿Me traes la cuenta? Sí, ___ traigo.|te la', 'g|Ella les da los libros. = Ella ___ da.|se los', 'g|Le doy el regalo. = ___ doy.|Se lo', 'g|Mis padres me regalaron un coche. = Mis padres ___ regalaron.|me lo', 'g|¿Se lo dijiste a ella? Sí, ___ dije.|se lo',
    'm|Le doy el libro. = ___ doy.|Se lo/Le lo/Lo le', 'm|Me dio la llave. = ___ dio.|Me la/Me lo/Se la', 'm|¿Les cuentas la historia? Sí, ___ cuento.|se la/les la/la les', 'm|Voy a ___ mañana. (decir + te + lo)|decírtelo/decirlote/dicírtelo', 'm|Te mandé el paquete. = ___ mandé.|Te lo/Se lo/Te la', 'm|Quiero ___ el regalo. (dar + les + lo)|dárselo/darselo/darloles']);
  gexAdd('es', 'B1', 'es-b1-condicionales', ['Conditional sentences with si', 'Real or possible: si + present, then present, future or imperative (Si llueve, me quedo; Si tengo tiempo, iré). Unlikely or unreal: si + imperfect subjunctive, then conditional (Si tuviera dinero, compraría una casa). Never use the conditional or the present subjunctive after si.'],
    ['Условные предложения с si', 'Реальное или возможное: si + настоящее, затем настоящее, будущее или императив (Si llueve, me quedo; Si tengo tiempo, iré). Маловероятное или нереальное: si + imperfecto de subjuntivo, затем condicional (Si tuviera dinero, compraría una casa). После si нельзя condicional и presente de subjuntivo.'],
    ['Oraciones condicionales con si', 'Reales o posibles: si + presente, luego presente, futuro o imperativo (Si llueve, me quedo; Si tengo tiempo, iré). Improbables o irreales: si + imperfecto de subjuntivo, luego condicional (Si tuviera dinero, compraría una casa). Tras si nunca van el condicional ni el presente de subjuntivo.'],
    ['Konditionalsätze mit si', 'Real oder möglich: si + Präsens, dann Präsens, Futur oder Imperativ (Si llueve, me quedo; Si tengo tiempo, iré). Unwahrscheinlich oder irreal: si + Imperfecto de subjuntivo, dann Condicional (Si tuviera dinero, compraría una casa). Nach si nie Condicional oder Präsens Subjuntivo.'],
    ['Uslovne rečenice sa si', 'Realno ili moguće: si + prezent, zatim prezent, futur ili imperativ (Si llueve, me quedo; Si tengo tiempo, iré). Malo verovatno ili nestvarno: si + imperfekat subjunktiva, zatim kondicional (Si tuviera dinero, compraría una casa). Posle si nikad kondicional ni prezent subjunktiva.'], [
    'g|Si ___ (llover), me quedo en casa.|llueve', 'g|Si tengo tiempo, ___ (ir) al cine.|iré', 'g|Si ___ (estudiar) más, aprobarás.|estudias', 'g|Si hace sol, ___ (nosotros / ir) a la playa.|iremos', 'g|Si yo ___ (tener) dinero, compraría una casa.|tuviera/tuviese', 'g|Si ella ___ (saber) la respuesta, te la diría.|supiera/supiese', 'g|Si nosotros ___ (vivir) en Madrid, iríamos más al museo.|viviéramos/viviésemos',
    'g|Si yo ___ (ser) tú, hablaría con él.|fuera/fuese', 'g|Si ellos ___ (poder), vendrían.|pudieran/pudiesen', 'g|Si ___ (hacer) frío, te daré mi abrigo.|hace', 'g|Si no ___ (llover), saldremos.|llueve', 'g|Si tú ___ (querer), podemos ir.|quieres', 'g|Si yo ___ (ganar) la lotería, viajaría por el mundo.|ganara/ganase', 'g|Si ___ (ellos / llegar) pronto, cenaremos juntos.|llegan',
    'm|Si ___ tiempo, iré. (yo)|tengo/tuviera/tendré', 'm|Si ___ rico, compraría un barco. (yo)|fuera/soy/seré', 'm|Si ___, me llamas. (necesitar, tú)|necesitas/necesitaras/necesitarás', 'm|¿Qué harías si ___ un millón? (tú)|ganaras/ganas/ganarás', 'm|Si no ___, nos quedamos en casa.|llueve/lloviera/lloverá', 'm|Si ___ más joven, viajaría más. (yo)|fuera/soy/seré']);
  gexAdd('es', 'B1', 'es-b1-perfecto-vs-indef', ['Perfecto vs indefinido', 'Perfecto: a time that is not finished (hoy, esta semana, este año, ya, todavía no) or experience (nunca, alguna vez). Indefinido: a finished time (ayer, la semana pasada, en 2015, hace dos años). In much of Latin America and the Canary Islands the indefinido is also used for today.'],
    ['Perfecto и indefinido', 'Perfecto: время не закончилось (hoy, esta semana, este año, ya, todavía no) или опыт (nunca, alguna vez). Indefinido: время закончилось (ayer, la semana pasada, en 2015, hace dos años). В большей части Латинской Америки и на Канарах indefinido используют и для сегодняшнего дня.'],
    ['Perfecto vs indefinido', 'Perfecto: tiempo no terminado (hoy, esta semana, este año, ya, todavía no) o experiencia (nunca, alguna vez). Indefinido: tiempo terminado (ayer, la semana pasada, en 2015, hace dos años). En gran parte de Hispanoamérica y en Canarias también se usa el indefinido para hoy.'],
    ['Perfecto und indefinido', 'Perfecto: nicht abgeschlossener Zeitraum (hoy, esta semana, este año, ya, todavía no) oder Erfahrung (nunca, alguna vez). Indefinido: abgeschlossene Zeit (ayer, la semana pasada, en 2015, hace dos años). In weiten Teilen Lateinamerikas und auf den Kanaren steht der Indefinido auch für heute.'],
    ['Perfecto i indefinido', 'Perfecto: vreme koje nije završeno (hoy, esta semana, este año, ya, todavía no) ili iskustvo (nunca, alguna vez). Indefinido: završeno vreme (ayer, la semana pasada, en 2015, hace dos años). U većem delu Latinske Amerike i na Kanarima indefinido se koristi i za danas.'], [
    'g|Ayer ___ (yo / ir) al cine.|fui', 'g|Esta mañana ___ (yo / desayunar) café.|he desayunado', 'g|El año pasado ___ (nosotros / viajar) a Cuba.|viajamos', 'g|Este año ___ (ellos / cambiar) de casa.|han cambiado', 'g|Mi hijo ___ (nacer) en 2015.|nació', 'g|Hoy ___ (nosotros / hablar) mucho.|hemos hablado', 'g|Anoche no ___ (yo / dormir) bien.|dormí',
    'g|¿Alguna vez ___ (tú / estar) en Roma?|has estado', 'g|La semana pasada ___ (ellos / llegar).|llegaron', 'g|Esta semana ___ (yo / trabajar) mucho.|he trabajado', 'g|Hace dos años ___ (yo / empezar) el curso.|empecé', 'g|Nunca ___ (yo / ver) esa película.|he visto', 'g|Ayer ___ (ella / comprar) un coche.|compró', 'g|Ya ___ (nosotros / terminar) el trabajo.|hemos terminado',
    'm|Ayer ___ al trabajo.|fui/he ido/iba', 'm|Hoy ___ mucho. (yo, comer)|he comido/comí/comía', 'm|El mes pasado ___ a Perú. (ella, viajar)|viajó/ha viajado/viaja', 'm|Esta semana ___ tres exámenes. (nosotros, hacer)|hemos hecho/hicimos/hacíamos', 'm|En 1999 ___ aquí. (ellos, llegar)|llegaron/han llegado/llegan', 'm|Todavía no ___ nada. (yo, comer)|he comido/comí/comía']);
  gexAdd('es', 'B1', 'es-b1-pasiva-se', ['Passive se and impersonal se', 'Se + third-person verb. The verb agrees with the thing: Se habla español, Se hablan dos idiomas, Se venden pisos. Impersonal se (no subject): Se vive bien aquí; ¿Se puede entrar? The true passive (ser + participle + por) is more formal: El libro fue escrito por Cervantes.'],
    ['Se пассивное и безличное', 'Se + глагол в 3-м лице. Глагол согласуется с предметом: Se habla español, Se hablan dos idiomas, Se venden pisos. Безличное se (без подлежащего): Se vive bien aquí; ¿Se puede entrar? Настоящий пассив (ser + причастие + por) формальнее: El libro fue escrito por Cervantes.'],
    ['Pasiva refleja y se impersonal', 'Se + verbo en tercera persona. El verbo concuerda con la cosa: Se habla español, Se hablan dos idiomas, Se venden pisos. Se impersonal (sin sujeto): Se vive bien aquí; ¿Se puede entrar? La pasiva con ser (ser + participio + por) es más formal: El libro fue escrito por Cervantes.'],
    ['Passiv mit se und unpersönliches se', 'Se + Verb in der 3. Person. Das Verb richtet sich nach der Sache: Se habla español, Se hablan dos idiomas, Se venden pisos. Unpersönliches se (ohne Subjekt): Se vive bien aquí; ¿Se puede entrar? Das echte Passiv (ser + Partizip + por) ist formeller: El libro fue escrito por Cervantes.'],
    ['Pasiv sa se i bezlično se', 'Se + glagol u 3. licu. Glagol se slaže sa stvari: Se habla español, Se hablan dos idiomas, Se venden pisos. Bezlično se (bez subjekta): Se vive bien aquí; ¿Se puede entrar? Pravi pasiv (ser + particip + por) je formalniji: El libro fue escrito por Cervantes.'], [
    'g|En España ___ (hablar) español.|se habla', 'g|En esta tienda ___ (vender) frutas.|se venden', 'g|___ (necesitar) camareros.|Se necesitan', 'g|Aquí no ___ (poder) fumar.|se puede', 'g|¿Cómo ___ (decir) “hello” en español?|se dice', 'g|___ (alquilar) pisos.|Se alquilan', 'g|En Japón ___ (comer) mucho pescado.|se come',
    'g|Ayer ___ (cerrar) la tienda.|se cerró', 'g|___ (prohibir) entrar con perros.|Se prohíbe', 'g|Dicen que ___ (vivir) bien aquí.|se vive', 'g|En este restaurante ___ (servir) cenas tarde.|se sirven', 'g|¿___ (poder) entrar?|Se puede', 'g|Se ___ (buscar) una secretaria.|busca', 'g|El libro fue escrito ___ Cervantes.|por',
    'm|Aquí ___ español.|se habla/se hablan/hablan se', 'm|___ pisos baratos.|Se venden/Se vende/Se vendes', 'm|No ___ fumar aquí.|se puede/se pueden/pueden', 'm|La casa fue construida ___ mi abuelo.|por/para/de', 'm|___ se dice “thanks” en español?|Cómo/Como/Qué', 'm|En Perú ___ mucho maíz.|se come/se comen/come se']);
  /* Spanish B2 */
  gexAdd('es', 'B2', 'es-b2-imperf-subj', ['Imperfect subjunctive', 'Take the ellos form of the indefinido, drop -ron, add -ra, -ras, -ra, -ramos, -rais, -ran (vinieran → viniera) or the -se forms (viniese). Use it when the main verb is in the past or conditional (Quería que vinieras), after ojalá for unlikely wishes, after como si, and in si-clauses (Si tuviera tiempo, viajaría).'],
    ['Imperfecto de subjuntivo', 'Возьмите форму ellos из indefinido, отбросьте -ron, добавьте -ra, -ras, -ra, -ramos, -rais, -ran (vinieran → viniera) или формы на -se (viniese). Используется, когда главный глагол в прошедшем или условном (Quería que vinieras), после ojalá для маловероятных желаний, после como si и в условных с si (Si tuviera tiempo, viajaría).'],
    ['Pretérito imperfecto de subjuntivo', 'Toma la forma ellos del indefinido, quita -ron y añade -ra, -ras, -ra, -ramos, -rais, -ran (vinieran → viniera) o las formas en -se (viniese). Se usa si el verbo principal está en pasado o condicional (Quería que vinieras), tras ojalá para deseos improbables, tras como si y en oraciones con si (Si tuviera tiempo, viajaría).'],
    ['Imperfecto de subjuntivo', 'Nimm die ellos-Form des Indefinido, streiche -ron, hänge -ra, -ras, -ra, -ramos, -rais, -ran an (vinieran → viniera) oder die -se-Formen (viniese). Verwendung: Hauptverb in Vergangenheit oder Condicional (Quería que vinieras), nach ojalá bei unwahrscheinlichen Wünschen, nach como si und in si-Sätzen (Si tuviera tiempo, viajaría).'],
    ['Imperfekat subjunktiva', 'Uzmi oblik ellos iz indefinida, odbaci -ron i dodaj -ra, -ras, -ra, -ramos, -rais, -ran (vinieran → viniera) ili oblike na -se (viniese). Koristi se kad je glavni glagol u prošlosti ili kondicionalu (Quería que vinieras), posle ojalá za malo verovatne želje, posle como si i u si-rečenicama (Si tuviera tiempo, viajaría).'], [
    'g|Quería que tú ___ (venir).|vinieras/vinieses', 'g|Me pidió que ___ (yo / ayudar).|ayudara/ayudase', 'g|Esperaba que ellos ___ (llegar) pronto.|llegaran/llegasen', 'g|No creía que ella ___ (saber) la verdad.|supiera/supiese', 'g|Si yo ___ (tener) tiempo, viajaría.|tuviera/tuviese', 'g|Dudaba que nosotros ___ (poder) ganar.|pudiéramos/pudiésemos', 'g|Me dijo que ___ (yo / hacer) los deberes.|hiciera/hiciese',

  gexAdd('es', 'B2', 'es-b2-perfecto-subj', ['Present perfect subjunctive', 'haya, hayas, haya, hayamos, hayáis, hayan + past participle. It is the subjunctive of the pretérito perfecto: Espero que hayas llegado bien. Me alegro de que hayan venido. Dudo que lo haya hecho. After cuando, en cuanto and hasta que it marks a completed future action: Cuando haya terminado, te llamo.'],

  gexAdd('es', 'B2', 'es-b2-irreales', ['Unreal conditionals', 'Unreal present: si + imperfect subjunctive, conditional (Si tuviera dinero, compraría una casa). Unreal past: si + pluscuamperfecto de subjuntivo, condicional perfecto (Si hubiera sabido, te lo habría dicho). Mixed: Si me hubiera tocado la lotería, ahora sería rico.'],

  gexAdd('es', 'B2', 'es-b2-subj-relative', ['Subjunctive in relative clauses', 'Indicative when the person or thing exists and is known (Tengo un amigo que habla alemán). Subjunctive when it is unknown, wanted, or may not exist (Busco a alguien que hable alemán; No hay nadie que sepa; ¿Hay algo que pueda ayudar?). Quien quiera, que venga.'],
    ['Subjuntivo в относительных предложениях', 'Индикатив: человек или предмет существует и известен (Tengo un amigo que habla alemán). Subjuntivo: он неизвестен, желаем или может не существовать (Busco a alguien que hable alemán; No hay nadie que sepa; ¿Hay algo que pueda ayudar?). Quien quiera, que venga.'],
    ['Subjuntivo en oraciones de relativo', 'Indicativo si la persona o cosa existe y se conoce (Tengo un amigo que habla alemán). Subjuntivo si es desconocida, deseada o puede no existir (Busco a alguien que hable alemán; No hay nadie que sepa; ¿Hay algo que pueda ayudar?). Quien quiera, que venga.'],
    ['Subjuntivo in Relativsätzen', 'Indikativ, wenn die Person oder Sache existiert und bekannt ist (Tengo un amigo que habla alemán). Subjuntivo, wenn sie unbekannt, gewünscht oder vielleicht nicht vorhanden ist (Busco a alguien que hable alemán; No hay nadie que sepa; ¿Hay algo que pueda ayudar?). Quien quiera, que venga.'],
    ['Subjunktiv u odnosnim rečenicama', 'Indikativ ako osoba ili stvar postoji i poznata je (Tengo un amigo que habla alemán). Subjunktiv ako je nepoznata, tražena ili možda ne postoji (Busco a alguien que hable alemán; No hay nadie que sepa; ¿Hay algo que pueda ayudar?). Quien quiera, que venga.'], [
    'g|Busco una persona que ___ (hablar) alemán. (I don’t know if she exists)|hable', 'g|Tengo un amigo que ___ (hablar) alemán.|habla', 'g|No hay nadie que ___ (saber) la respuesta.|sepa', 'g|Quiero un coche que ___ (ser) barato.|sea', 'g|Hay alguien que ___ (poder) ayudarme.|puede', 'g|¿Hay algún restaurante que ___ (servir) comida vegana?|sirva', 'g|Necesito un piso que ___ (tener) terraza.|tenga',

  gexAdd('es', 'B2', 'es-b2-estilo-indirecto', ['Reported speech', 'When the reporting verb is in the past, tenses move back: presente → imperfecto, futuro → condicional, perfecto → pluscuamperfecto, imperativo → imperfecto de subjuntivo (Dijo que vendría; Me pidió que cerrara la puerta). Questions: preguntó si … / qué … Time words change: mañana → al día siguiente, hoy → ese día, aquí → allí.'],
    ['Косвенная речь', 'Если глагол речи в прошедшем, времена сдвигаются: presente → imperfecto, futuro → condicional, perfecto → pluscuamperfecto, императив → imperfecto de subjuntivo (Dijo que vendría; Me pidió que cerrara la puerta). Вопросы: preguntó si … / qué … Маркеры меняются: mañana → al día siguiente, hoy → ese día, aquí → allí.'],
    ['Estilo indirecto', 'Si el verbo de habla está en pasado, los tiempos retroceden: presente → imperfecto, futuro → condicional, perfecto → pluscuamperfecto, imperativo → imperfecto de subjuntivo (Dijo que vendría; Me pidió que cerrara la puerta). Preguntas: preguntó si … / qué … Cambian los marcadores: mañana → al día siguiente, hoy → ese día, aquí → allí.'],
    ['Indirekte Rede', 'Steht das Verb des Sagens in der Vergangenheit, rücken die Zeiten zurück: presente → imperfecto, futuro → condicional, perfecto → pluscuamperfecto, Imperativ → Imperfecto de subjuntivo (Dijo que vendría; Me pidió que cerrara la puerta). Fragen: preguntó si … / qué … Zeitangaben ändern sich: mañana → al día siguiente, hoy → ese día, aquí → allí.'],
    ['Neupravni govor', 'Kad je glagol govorenja u prošlosti, vremena se pomeraju unazad: presente → imperfecto, futuro → condicional, perfecto → pluscuamperfecto, imperativ → imperfecto de subjuntivo (Dijo que vendría; Me pidió que cerrara la puerta). Pitanja: preguntó si … / qué … Odrednice se menjaju: mañana → al día siguiente, hoy → ese día, aquí → allí.'], [
    'g|Dijo: “Estoy cansado.” → Dijo que ___ cansado.|estaba', 'g|Dijo: “Vivo en Madrid.” → Dijo que ___ en Madrid.|vivía', 'g|Dijo: “Mañana iré.” → Dijo que ___ al día siguiente.|iría', 'g|Dijo: “He comido.” → Dijo que ___ comido.|había', 'g|Preguntó: “¿Dónde vives?” → Preguntó dónde ___.|vivía', 'g|Preguntó: “¿Tienes hambre?” → Preguntó ___ tenía hambre.|si', 'g|Me dijo: “Ven.” → Me dijo que ___.|viniera/viniese',
    'g|Dijo: “Ayer compré un coche.” → Dijo que ___ un coche el día anterior.|había comprado/compró', 'g|Dijo: “Hoy hace frío.” → Dijo que ___ hacía frío.|ese día/aquel día', 'g|Dijo: “Quiero ir.” → Dijo que ___ ir.|quería', 'g|Dijo: “No puedo venir.” → Dijo que no ___ venir.|podía', 'g|Preguntó: “¿Qué haces?” → Preguntó qué ___.|hacía', 'g|Dijo: “Aquí hay mucha gente.” → Dijo que ___ había mucha gente.|allí', 'g|Me pidió: “Cierra la puerta.” → Me pidió que ___ la puerta.|cerrara/cerrase',

  gexAdd('es', 'B2', 'es-b2-pasiva', ['Passive voice', 'ser + past participle (agreeing in gender and number) + por: La casa fue construida por mi abuelo; Los libros fueron escritos por Borges. It is typical of written, formal Spanish. Estar + participle describes a result, not an action: La puerta está cerrada.'],
    ['Страдательный залог', 'ser + причастие (согласуется в роде и числе) + por: La casa fue construida por mi abuelo; Los libros fueron escritos por Borges. Характерен для письменной, формальной речи. Estar + причастие описывает результат, а не действие: La puerta está cerrada.'],
    ['Voz pasiva', 'ser + participio (concuerda en género y número) + por: La casa fue construida por mi abuelo; Los libros fueron escritos por Borges. Es típica del español escrito y formal. Estar + participio describe un resultado, no una acción: La puerta está cerrada.'],

  gexAdd('es', 'B2', 'es-b2-perifrasis', ['Verbal periphrases', 'Gerund: llevar + time + gerundio (Llevo dos años estudiando), seguir + gerundio, andar + gerundio, estar + gerundio. Infinitive: acabar de (just did), soler (usually), tener que, ir a, volver a (again), ponerse a (start suddenly). Dejar de + infinitive = stop doing.'],

    ['Perífrasis verbales', 'Gerundio: llevar + tiempo + gerundio (Llevo dos años estudiando), seguir + gerundio, andar + gerundio, estar + gerundio. Infinitivo: acabar de (hace un momento), soler (habitual), tener que, ir a, volver a (otra vez), ponerse a (empezar de repente). Dejar de + infinitivo = parar de hacer.'],
    ['Verbalperiphrasen', 'Gerundium: llevar + Zeit + gerundio (Llevo dos años estudiando), seguir + gerundio, andar + gerundio, estar + gerundio. Infinitiv: acabar de (gerade getan), soler (gewöhnlich), tener que, ir a, volver a (wieder), ponerse a (plötzlich anfangen). Dejar de + Infinitiv = aufhören.'],
    ['Glagolske perifraze', 'Gerund: llevar + vreme + gerundio (Llevo dos años estudiando), seguir + gerundio, andar + gerundio, estar + gerundio. Infinitiv: acabar de (upravo), soler (obično), tener que, ir a, volver a (ponovo), ponerse a (iznenada početi). Dejar de + infinitiv = prestati.'], [

    'm|Llevo mucho tiempo ___ aquí.|viviendo/vivir/vivido', 'm|Acabo de ___ a casa.|llegar/llegando/llegado', 'm|Suelo ___ café por la mañana.|tomar/tomando/tomado', 'm|Todavía sigue ___.|lloviendo/llover/llovido', 'm|Dejó de ___ hace años.|fumar/fumando/fumado', 'm|Voy a ___ mañana.|viajar/viajando/viajado']);
  gexAdd('es', 'B2', 'es-b2-conectores', ['Concessive and causal connectors', 'Aunque + indicative (a known fact: Aunque hacía frío, salimos) or subjunctive (a possibility or irrelevant: Aunque llueva, iremos). A pesar de + noun or infinitive; a pesar de que + clause. Cause: porque, como (at the start), ya que, puesto que. Contrast: sin embargo, no obstante. Result: así que, por eso.'],
    ['Уступительные и причинные союзы', 'Aunque + индикатив (известный факт: Aunque hacía frío, salimos) или subjuntivo (возможность или неважно: Aunque llueva, iremos). A pesar de + существительное или инфинитив; a pesar de que + предложение. Причина: porque, como (в начале), ya que, puesto que. Контраст: sin embargo, no obstante. Следствие: así que, por eso.'],
    ['Conectores concesivos y causales', 'Aunque + indicativo (hecho conocido: Aunque hacía frío, salimos) o subjuntivo (posibilidad o irrelevante: Aunque llueva, iremos). A pesar de + sustantivo o infinitivo; a pesar de que + oración. Causa: porque, como (al inicio), ya que, puesto que. Contraste: sin embargo, no obstante. Consecuencia: así que, por eso.'],
    ['Konzessive und kausale Konnektoren', 'Aunque + Indikativ (bekannte Tatsache: Aunque hacía frío, salimos) oder Subjuntivo (Möglichkeit oder egal: Aunque llueva, iremos). A pesar de + Nomen oder Infinitiv; a pesar de que + Satz. Grund: porque, como (am Anfang), ya que, puesto que. Gegensatz: sin embargo, no obstante. Folge: así que, por eso.'],
    ['Dopusni i uzročni veznici', 'Aunque + indikativ (poznata činjenica: Aunque hacía frío, salimos) ili subjunktiv (mogućnost ili nevažno: Aunque llueva, iremos). A pesar de + imenica ili infinitiv; a pesar de que + rečenica. Uzrok: porque, como (na početku), ya que, puesto que. Kontrast: sin embargo, no obstante. Posledica: así que, por eso.'], [

  function gexItem(line){ var p = line.split('|'); return {type: p[0], text: p[1], ans: p[2].split('/')}; }
  /* "didn't" = "did not", "I'm" = "I am" ... so both spellings are accepted */
  function gexNorm(s){
    return norm(String(s).replace(/[‘’]/g, "'")).replace(/\bcan't\b/g, 'cannot').replace(/\bwon't\b/g, 'will not').replace(/n't\b/g, ' not').replace(/'ll\b/g, ' will').replace(/'re\b/g, ' are').replace(/'ve\b/g, ' have').replace(/'m\b/g, ' am').replace(/\bcan not\b/g, 'cannot').replace(/\s+/g, ' ').trim();
  }
  function gexVariants(s){
    var v = [gexNorm(s)], m = /^\s*['’]s\b\s*(.*)$/i.exec(s);
    if (m) { v.push(gexNorm('is ' + m[1])); v.push(gexNorm('has ' + m[1])); }
    return v;
  }

  function gexPractice(id, list){
    var tp = gexFind(id); if (!tp) return gexHub();
    var items = list || fresh('gex:' + gexLang + ':' + gexLevel + ':' + id, tp.items.map(gexItem), 10).map(function(x){ return x; });
    var n = items.length, i = 0, right = 0, wrong = [];
    function draw(){
      if (i >= n) return gResults(right, n, wrong, function(){ gexPractice(id, wrong); }, function(){ gexPractice(id); }, 'sentences_ok');
      var it = items[i], head = '<div class="top"><button class="link" data-gextopic="' + id + '">' + esc(t('back')) + '</button><span class="count">' + (i + 1) + ' / ' + n + '</span></div>' +

        var html = esc(it.text).replace('___', '<input class="gap" id="gx" type="text" style="width:' + w + 'ch" aria-label="' + esc(t('blank', {k: 1})) + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">');
        app.innerHTML = head + '<p class="label" style="margin-top:22px">' + esc(t('g_fill')) + '</p><p class="sentence">' + html + '</p><div id="fb" role="status"></div><div class="row" id="act"><button class="btn primary" id="check">' + esc(t('check')) + '</button></div>';
        var inp = $('#gx'), checked = false; inp.focus();
        var doCheck = function(){
          if (checked) return; checked = true;
          var vs = gexVariants(inp.value), good = it.ans.some(function(a){ var g = gexNorm(a); return vs.indexOf(g) > -1; });
          inp.readOnly = true; inp.classList.add(good ? 'ok' : 'no');
          if (!good) inp.insertAdjacentHTML('afterend', '<span class="fix">' + esc(it.ans[0].replace(/’/g, '’')) + (it.ans.length > 1 ? ' / ' + esc(it.ans.slice(1).join(' / ')) : '') + '</span>');
          if (good) right++; else wrong.push(it);
          $('#fb').innerHTML = '<div class="fb ' + (good ? 'ok' : 'no') + '"><b>' + esc(good ? t('correct') : t('not_quite')) + '</b> ' + (good ? '' : esc(t('answer_green'))) + '</div>' + (good ? '' : rule);
          $('#act').innerHTML = '<button class="btn primary" id="next">' + esc(i === n - 1 ? t('see_results') : t('next')) + '</button>';
          $('#next').onclick = function(){ i++; draw(); }; $('#next').focus();
        };
        inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); doCheck(); } });
        $('#check').onclick = doCheck;
      } else {
        var opts = shuffle(it.ans.map(function(o, k){ return {t: o, c: k === 0}; }));
        app.innerHTML = head + '<p class="label" style="margin-top:22px">' + esc(t('g_choose')) + '</p><p class="q" dir="auto">' + esc(it.text) + '</p><div class="opts">' +

        [].forEach.call(app.querySelectorAll('.opt'), function(btn){
          btn.onclick = function(){
            var ok = opts[+btn.dataset.j].c;
            [].forEach.call(app.querySelectorAll('.opt'), function(b){ var o = opts[+b.dataset.j]; b.disabled = true; if (o.c) b.classList.add('right'); else if (b === btn) b.classList.add('wrong'); else b.classList.add('dim'); });
            if (ok) right++; else wrong.push(it);
            $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + esc(ok ? t('correct') : t('not_quite')) + '</b></div>' + (ok ? '' : rule);
            $('#act').innerHTML = '<button class="btn primary" id="next">' + esc(i === n - 1 ? t('see_results') : t('next')) + '</button>';
            $('#next').onclick = function(){ i++; draw(); }; $('#next').focus();
          };
        });
      }
      window.scrollTo(0, 0);
    }
    draw();
  }

  function mdToHtml(text){

    function open(tag){ if (list !== tag) { close(); out.push('<' + tag + '>'); list = tag; } }
    while (i < lines.length) {
      var t = lines[i].trim();
      if (!t) { close(); i++; continue; }
      if ((m = /^(#{1,6})\s+(.*?)\s*#*$/.exec(t))) { close(); var n = Math.min(m[1].length, 3) + 1; out.push('<h' + n + ' dir="auto">' + mdInline(m[2]) + '</h' + n + '>'); i++; continue; }
      if (t[0] === '|') {
        close(); var rows = [];
        while (i < lines.length && lines[i].trim()[0] === '|') { rows.push(mdCells(lines[i])); i++; }
        var head = rows.length > 1 && rows[1].every(function(c){ return /^:?-+:?$/.test(c.replace(/\s/g, '')); });
        var h = '<div class="tw"><table>';
        rows.forEach(function(r, ri){

          h += '<tr>' + r.map(function(c){ return '<' + tag + ' dir="auto">' + mdInline(c) + '</' + tag + '>'; }).join('') + '</tr>';
        });

      }

        return;
      }
      app.innerHTML = '<div class="bar"><button class="link" data-back>' + esc(t('back')) + '</button><div class="zoom"><button class="zbtn" id="zout" aria-label="' + esc(t('zoom_out')) + '">−</button><span class="zl" id="zl">100%</span><button class="zbtn" id="zin" aria-label="' + esc(t('zoom_in')) + '">+</button></div></div>' +
        '<h1 class="rt" dir="auto">' + esc(title) + '</h1><p class="hint">' + esc(t('zoom_hint')) + '</p>' +
        '<div class="pages" id="pages"><p class="rmsg">' + esc(t('drawing')) + '</p></div>' + practise;
      host = $('#pages');
      if (!window.pdfjsLib) { host.innerHTML = '<p class="rmsg">' + esc(t('err_nolib')) + '</p>'; return; }
      function setZoom(d){ zi = Math.max(0, Math.min(ZOOMS.length - 1, zi + d)); $('#zl').textContent = Math.round(ZOOMS[zi] * 100) + '%'; $('#zout').disabled = zi === 0; $('#zin').disabled = zi === ZOOMS.length - 1; draw(); }
      $('#zout').onclick = function(){ setZoom(-1); };
      $('#zin').onclick = function(){ setZoom(1); };
      $('#zout').disabled = true;
      function draw(){
        if (!pdfDoc) return;
        var my = ++token, w = Math.floor(host.clientWidth * ZOOMS[zi]), chain = Promise.resolve();
        host.innerHTML = '';
        for (var n = 1; n <= pdfDoc.numPages; n++) (function(n){
          chain = chain.then(function(){
            if (my !== token) return;
            return pdfDoc.getPage(n).then(function(page){
              if (my !== token) return;
              var vp = page.getViewport({scale: 1}), k = w / vp.width, cssH = vp.height * k;
              var dpr = Math.min(window.devicePixelRatio || 1, 3), area = (w * dpr) * (cssH * dpr);
              if (area > 9e6) dpr *= Math.sqrt(9e6 / area);
              var c = document.createElement('canvas');
              c.className = 'pg'; c.width = Math.floor(w * dpr); c.height = Math.floor(cssH * dpr);
              c.style.width = w + 'px'; c.style.height = cssH + 'px';
              c.setAttribute('role', 'img'); c.setAttribute('aria-label', t('page_of', {n: n, m: pdfDoc.numPages}));
              host.appendChild(c);
              return page.render({canvasContext: c.getContext('2d'), viewport: page.getViewport({scale: k * dpr})}).promise;
            });
          });
        })(n);
        chain.catch(function(){ if (my === token && !host.childNodes.length) host.innerHTML = '<p class="rmsg">' + esc(t('err_draw')) + '</p>'; });
      }
      pdfjsLib.getDocument({data: new Uint8Array(rec.data.slice(0))}).promise.then(function(doc){
        pdfDoc = doc; draw();
        var lastW = host.clientWidth;
        onResize = function(){ if (!host.isConnected) { onResize = null; return; } if (Math.abs(host.clientWidth - lastW) > 20) { lastW = host.clientWidth; draw(); } };
      }).catch(function(){ host.innerHTML = '<p class="rmsg">' + esc(t('err_open')) + '</p>'; });
    });
  }

  /* ---------- lesson menu ---------- */
  var MODES = [
    {id: 'cards', name: 'm_cards', min: 1, count: function(d){ return plural(d.items.length, 'card'); }},
    {id: 'gaps',  name: 'm_gaps',  min: 1, count: function(d){ return t('per_round', {n: Math.min(10, d.items.length)}); }},
    {id: 'quiz',  name: 'm_quiz',  min: 2, count: function(d){ return t('per_round', {n: Math.min(10, d.items.length)}); }},
    {id: 'match', name: 'm_match', min: 3, count: function(d){ return plural(Math.min(12, d.items.length), 'pair'); }},
    {id: 'listen', name: 'm_listen', min: 1, count: function(d){ return t('per_round', {n: Math.min(10, listenItems(d).length)}); }}
  ];
  /* Pick n items, preferring ones not used in the last rounds, so repeat sessions bring new sentences. */
  function fresh(key, pool, n){
    var seen = (S.seen || (S.seen = {}))[key] || [];
    function k(it){ return it.text ? it.text : it.inf ? it.inf + (it.p !== undefined ? '' : '') : it.f ? it.f[0] : (it.a || it.src || it.q || JSON.stringify(it)); }
    var unseen = pool.filter(function(it){ return seen.indexOf(k(it)) < 0; });
    var pick = sample(unseen, n);
    if (pick.length < n) {
      /* everything has been heard: start a new cycle, keeping the items just picked out of the first picks */
      var rest = sample(pool.filter(function(it){ return pick.indexOf(it) < 0; }), n - pick.length);
      pick = pick.concat(rest);
      seen = [];
    }
    pick.forEach(function(it){ seen.push(k(it)); });
    S.seen[key] = seen.slice(-400);
    persist();
    return shuffle(pick);
  }
  function listenItems(d){ return d.items.filter(function(it){ return SPEECH && LOCALES[it.l] && allVoices().length > 0 && !!pickVoice(it.l); }); }
  function menu(deck){
    cur = deck; setView('lessons');
    var last = S.last[deck.id] || {};
    app.innerHTML =
      '<button class="link" data-lib>' + esc(t('all_lessons')) + '</button>' +
      '<header><p class="eyebrow"><span>' + plural(deck.items.length, 'chunk') + '</span></p>' +
      '<h1><span class="hl">' + esc(deck.title) + '</span></h1></header>' +
      (have[deck.id] ? '<div class="row" style="margin-top:18px"><button class="btn ghost" data-read="' + esc(deck.id) + '" style="flex:none">' + esc(t('read_first')) + '</button></div>' : '') +
      (SPEECH && deck.id !== '*' && deck.id.slice(0, 2) !== 'm:' ? '<div class="voice"><label class="label" for="lsel" style="margin:0">' + esc(t('speak_in')) + '</label><div style="max-width:260px">' + langSelect('lsel', deck.lang, true) + '</div></div>' + (deck.lang !== 'off' ? '<div id="vbox">' + voiceSelect(deck.lang) + '</div>' : '') : '') +
      '<div class="tiles">' + MODES.map(function(m){
        var ls = m.id === 'listen', n = ls ? listenItems(deck).length : deck.items.length, off = n < m.min;
        return '<button class="tile' + (ls ? ' wide' : '') + '" data-mode="' + m.id + '"' + (off ? ' disabled' : '') + '><span class="tn">' + esc(t(m.name)) + '</span><span class="tc">' + esc(off ? t(ls ? 'needs_voice' : 'needs_more') : m.count(deck)) + '</span>' +
          '<span class="tl">' + esc(last[m.id] ? t('last', {x: last[m.id]}) : t('not_tried')) + '</span></button>';
      }).join('') + '</div>';
    window.scrollTo(0, 0);
    bindVoiceSelect(deck);
  }
  function bindVoiceSelect(deck){
    var sel = document.getElementById('vsel'); if (!sel || !deck.lang) return;
    sel.onchange = function(){
      if (sel.value) CHOSEN[deck.lang] = sel.value; else delete CHOSEN[deck.lang];
      try { localStorage.setItem('revision-room:voices', JSON.stringify(CHOSEN)); } catch (e) {}
      var l = S.lessons.filter(function(x){ return x.id === deck.id; })[0];
      if (l && l.items.length) speak(l.items[0].a, deck.lang);
    };
  }
  if (SPEECH) { try { speechSynthesis.addEventListener('voiceschanged', function(){ var b = document.getElementById('vbox'); if (b && cur && cur.lang && cur.lang !== 'off') { b.innerHTML = voiceSelect(cur.lang); bindVoiceSelect(cur); } if (cur && app.querySelector('.tiles')) { var fd = deckOf(cur.id); if (fd) menu(fd); } }); } catch (e) {} }
  function run(id){ if (id === 'cards') flash(cur); else if (id === 'gaps') gaps(cur); else if (id === 'quiz') quiz(cur); else if (id === 'match') match(cur); else if (id === 'listen') listen(cur); }

  function finish(id, o){
    stopSpeech();
    if (o.save !== false) { S.last[cur.id] = S.last[cur.id] || {}; S.last[cur.id][id] = o.last; persist(); }
    var msg = o.pct >= 90 ? t('r_clean') : o.pct >= 60 ? t('r_solid') : t('r_more');
    app.innerHTML = '<div class="res"><p class="label">' + esc(t('finished')) + '</p><p class="big">' + esc(o.big) + '</p><p class="sub">' + esc(o.sub) + '</p><p class="msg2">' + msg + '</p>' +
      '<div class="row">' + (o.retry ? '<button class="btn primary" id="retry">' + esc(t('retry')) + '</button>' : '') +
      '<button class="btn ' + (o.retry ? 'ghost' : 'primary') + '" id="again">' + esc(t('again_go')) + '</button><button class="btn ghost" data-back>' + esc(t('back_lesson')) + '</button></div></div>';
    if (o.retry) $('#retry').onclick = o.retry;
    $('#again').onclick = o.again;
    window.scrollTo(0, 0);
  }

  /* ---------- Flashcards ---------- */
  function flash(deck){
    var cards = deck.items.map(function(it){ return {front: it.a, back: it.b, l: it.l, src: it}; });
    var total = cards.length, q = shuffle(cards.map(function(_, i){ return i; }));
    var known = 0, rev = false, flipped = false, again = {}, againN = 0;
    function draw(){
      if (!q.length) {
        var first = total - againN;
        return finish('cards', {big: first + ' / ' + total, sub: t('cards_known'), pct: first / total * 100, last: first + '/' + total, again: function(){ flash(deck); }});
      }
      var c = cards[q[0]];
      var front = rev ? c.back : c.front, back = rev ? c.front : c.back;
      var lblQ = t('question'), lblA = t('answer');
      var talk = SPEECH && LOCALES[c.l] && !(rev && !flipped), noVoice = talk && !hasVoiceFor(c.l);
      app.innerHTML = top(known, total, t('known', {k: known, n: total})) +
        '<div class="fwrap"><button class="flash" id="flip" aria-label="' + esc(t('flip_aria', {s: flipped ? lblA : lblQ})) + '"><span class="side">' + (flipped ? lblA : lblQ) + '</span>' +
        '<span class="face ' + (flipped ? 'back' : '') + '" dir="auto">' + esc(flipped ? back : front) + '</span></button>' +
        (talk && !noVoice ? '<button class="spk" id="spk" aria-label="' + esc(t('hear')) + '"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' : '') + '</div>' +
        (noVoice ? '<p class="hint">' + esc(t('no_voice_card', {l: LN(c.l)})) + '</p>' : '') +
        (flipped ? '<div class="row"><button class="btn ghost" id="again">' + esc(t('again')) + '</button><button class="btn primary" id="got">' + esc(t('got')) + '</button></div>' : '<p class="hint">' + esc(t('tap_flip')) + '</p>') +
        '<div class="links"><button class="link small" id="swap">' + esc(rev ? t('show_q') : t('show_a')) + '</button>' +
        (talk && !noVoice ? '<button class="link small" id="slow" aria-pressed="' + SLOW + '">' + esc(SLOW ? t('slow_on') : t('slow_off')) + '</button>' : '') + '</div>';
      $('#flip').onclick = function(){ flipped = !flipped; draw(); if (flipped && $('#got')) $('#got').focus(); };
      $('#swap').onclick = function(){ rev = !rev; flipped = false; draw(); };
      if ($('#spk')) $('#spk').onclick = function(){ speak(c.front, c.l); };
      if ($('#slow')) $('#slow').onclick = function(){ SLOW = !SLOW; try { localStorage.setItem('revision-room:slow', SLOW ? '1' : '0'); } catch (e) {} draw(); speak(c.front, c.l); };
      if (flipped) {
        $('#got').onclick = function(){ q.shift(); known++; flipped = false; draw(); };
        $('#again').onclick = function(){ if (!again[q[0]]) { again[q[0]] = 1; againN++; } q.push(q.shift()); flipped = false; draw(); };
      }
    }
    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Fill the gaps ---------- */
  function gaps(deck, list){
    var items = list || sample(deck.items, 10).map(Parser.makeGap), n = items.length, i = 0, right = 0, wrong = [];
    function draw(){
      if (i >= n) {
        return finish('gaps', {big: right + ' / ' + n, sub: t('sentences_ok'), pct: right / n * 100, last: right + '/' + n, save: !list,
          again: function(){ gaps(deck); }, retry: wrong.length ? function(){ gaps(deck, wrong); } : null});
      }
      var it = items[i], blanks = [], k = 0;
      var html = it.text.split(/\{\{(.+?)\}\}/g).map(function(p, idx){
        if (idx % 2 === 0) return esc(p);
        blanks.push(p); k++;
        return '<input class="gap" dir="auto" type="text" style="width:' + Math.max(4, p.split('|')[0].length + 2) + 'ch" aria-label="' + esc(t('blank', {k: k})) + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">';
      }).join('');
      app.innerHTML = top(i, n, (i + 1) + ' / ' + n) +
        '<p class="label">' + esc(it.whole ? t('type_phrase') : t('fill_gap')) + '</p><p class="sentence" dir="auto">' + html + '</p>' +
        (it.hint ? '<p class="hint">' + esc(it.hint) + '</p>' : '') +
        '<div id="fb" role="status"></div><div class="row" id="act"><button class="btn primary" id="check">' + esc(t('check')) + '</button></div>';
      var ins = [].slice.call(app.querySelectorAll('input.gap')), checked = false;
      if (ins[0]) ins[0].focus();
      function doCheck(){
        if (checked) return; checked = true;
        var ok = true;
        ins.forEach(function(inp, j){
          var accepted = blanks[j].split('|').map(norm), good = accepted.indexOf(norm(inp.value)) > -1;
          inp.readOnly = true; inp.classList.add(good ? 'ok' : 'no');
          if (!good) { ok = false; inp.insertAdjacentHTML('afterend', '<span class="fix">' + esc(blanks[j].split('|')[0]) + '</span>'); }
        });
        if (ok) right++; else wrong.push(it);
        $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + esc(ok ? t('correct') : t('not_quite')) + '</b> ' + esc(ok ? '' : t('answer_green')) + '</div>';
        $('#act').innerHTML = '<button class="btn primary" id="next">' + esc(i === n - 1 ? t('see_results') : t('next')) + '</button>';
        $('#next').onclick = function(){ i++; draw(); };
        $('#next').focus();
      }
      ins.forEach(function(inp){ inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); doCheck(); } }); });
      $('#check').onclick = doCheck;
    }
    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Quiz ---------- */
  function quiz(deck, list){
    var items = list || Parser.makeQuiz(deck.items, 10), n = items.length, i = 0, right = 0, wrong = [];
    function draw(){
      if (i >= n) {
        return finish('quiz', {big: right + ' / ' + n, sub: t('questions_ok'), pct: right / n * 100, last: right + '/' + n, save: !list,
          again: function(){ quiz(deck); }, retry: wrong.length ? function(){ quiz(deck, wrong); } : null});
      }
      var it = items[i];
      var opts = shuffle(it.options.map(function(t, idx){ return {t: t, c: idx === it.answer}; }));
      app.innerHTML = top(i, n, (i + 1) + ' / ' + n) +
        '<p class="q" dir="auto">' + esc(it.q) + '</p><div class="opts">' +
        opts.map(function(o, j){ return '<button class="opt" data-j="' + j + '"><span class="k">' + 'ABCDEF'[j] + '</span><span dir="auto">' + esc(o.t) + '</span></button>'; }).join('') +
        '</div><div id="fb" role="status"></div><div class="row" id="act"></div>';
      [].forEach.call(app.querySelectorAll('.opt'), function(btn){
        btn.onclick = function(){
          var ok = opts[+btn.dataset.j].c;
          [].forEach.call(app.querySelectorAll('.opt'), function(b){
            var o = opts[+b.dataset.j]; b.disabled = true;
            if (o.c) b.classList.add('right'); else if (b === btn) b.classList.add('wrong'); else b.classList.add('dim');
          });
            if (ok) right++; else wrong.push(it);
          $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + esc(ok ? t('correct') : t('not_quite')) + '</b> ' + (it.explain ? esc(it.explain) : '') + '</div>';
          $('#act').innerHTML = '<button class="btn primary" id="next">' + esc(i === n - 1 ? t('see_results') : t('next')) + '</button>';
          $('#next').onclick = function(){ i++; draw(); };
          $('#next').focus();
        };
      });
    }
    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Listening: hear the phrase, type it ---------- */
  function fold(s){ return norm(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0451/g, '\u0435'); }
  function listen(deck, list){
    var items = list || fresh('listen:' + deck.id, listenItems(deck), 10), n = items.length, i = 0, right = 0, wrong = [];
    var ICON = '<svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    function draw(){
      if (!n || i >= n) {
        return finish('listen', {big: right + ' / ' + n, sub: t('heard_ok'), pct: n ? right / n * 100 : 0, last: right + '/' + n, save: !list,
          again: function(){ listen(deck); }, retry: wrong.length ? function(){ listen(deck, wrong); } : null});
      }
      var it = items[i];
      app.innerHTML = top(i, n, (i + 1) + ' / ' + n) +
        '<p class="label">' + esc(t('listen_label')) + '</p>' +
        '<div class="lwrap"><button class="lspk" id="spk" aria-label="' + esc(t('hear')) + '">' + ICON + '</button></div>' +
        '<input class="lin" id="lin" dir="auto" type="text" aria-label="' + esc(t('listen_label')) + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<p class="hint" id="lhint"></p><div id="fb" role="status"></div><div class="row" id="act"><button class="btn primary" id="check">' + esc(t('check')) + '</button></div>' +
        '<div class="links"><button class="link small" id="meaning">' + esc(t('show_meaning')) + '</button>' +
        '<button class="link small" id="slow" aria-pressed="' + SLOW + '">' + esc(SLOW ? t('slow_on') : t('slow_off')) + '</button></div>';
      var inp = $('#lin'), checked = false;
      inp.focus();
      $('#spk').onclick = function(){ speak(it.a, it.l); inp.focus(); };
      $('#slow').onclick = function(){ SLOW = !SLOW; try { localStorage.setItem('revision-room:slow', SLOW ? '1' : '0'); } catch (e) {} $('#slow').textContent = SLOW ? t('slow_on') : t('slow_off'); $('#slow').setAttribute('aria-pressed', SLOW); speak(it.a, it.l); inp.focus(); };
      $('#meaning').onclick = function(){ $('#lhint').textContent = it.b; };
      function doCheck(){
        if (checked) return; checked = true;
        var typed = inp.value, spoken = speakable(it.a), plain = it.a.replace(/\([^)]*\)/g, ' ');
        var exact = [it.a, spoken, plain].some(function(x){ return norm(x) === norm(typed); });
        var near = !exact && [it.a, spoken, plain].some(function(x){ return fold(x) === fold(typed); });
        var ok = exact || near;
        if (ok) right++; else wrong.push(it);
        inp.readOnly = true; inp.classList.add(ok ? 'ok' : 'no');
        $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + esc(ok ? t('correct') : t('not_quite')) + '</b> ' +
          esc(near ? t('l_accents', {x: it.a}) : ok ? '' : t('l_answer', {x: it.a})) + (ok ? '' : '<br>' + esc(it.b)) + '</div>';
        $('#act').innerHTML = '<button class="btn primary" id="next">' + esc(i === n - 1 ? t('see_results') : t('next')) + '</button>';
        $('#next').onclick = function(){ i++; draw(); };
        $('#next').focus();
      }
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); if (checked) { i++; draw(); } else doCheck(); } });
      $('#check').onclick = doCheck;
      speak(it.a, it.l);
    }
    draw();
    window.scrollTo(0, 0);
  }

  /* ---------- Matching ---------- */
  function match(deck){
    var pairs = sample(deck.items, 12).map(function(p, i){ return {id: i, a: p.a, b: p.b, s: p}; });
    var size = pairs.length <= 7 ? pairs.length : 6, rounds = [];
    for (var s = 0; s < pairs.length; s += size) rounds.push(pairs.slice(s, s + size));
    if (rounds.length > 1 && rounds[rounds.length - 1].length < 3) { var tail = rounds.pop(); rounds[rounds.length - 1] = rounds[rounds.length - 1].concat(tail); }
    var r = 0, slips = 0, total = pairs.length, doneTotal = 0;
    function draw(){
      if (r >= rounds.length) {
        var pct = total / (total + slips) * 100, s2 = slips === 0 ? t('no_slips') : plural(slips, 'slip');
        return finish('match', {big: s2, sub: t('pairs_matched', {n: total}), pct: pct, last: s2, again: function(){ match(deck); }});
      }
      var round = rounds[r], left = shuffle(round), right = shuffle(round), sel = null, matched = 0;
      function label(){ return t('round_of', {r: r + 1, m: rounds.length, s: plural(slips, 'slip')}); }
      app.innerHTML = top(doneTotal, total, label()) +
        '<p class="label">' + esc(t('match_help')) + '</p><div class="cols">' +
        '<div class="col">' + left.map(function(p){ return '<button class="chip" data-side="a" dir="auto" data-id="' + p.id + '">' + esc(p.a) + '</button>'; }).join('') + '</div>' +
        '<div class="col">' + right.map(function(p){ return '<button class="chip" data-side="b" dir="auto" data-id="' + p.id + '">' + esc(p.b) + '</button>'; }).join('') + '</div></div>';
      [].forEach.call(app.querySelectorAll('.chip'), function(chip){
        chip.onclick = function(){
          if (chip.classList.contains('done')) return;
          var side = chip.dataset.side, id = chip.dataset.id;
          if (sel && sel.el === chip) { chip.classList.remove('sel'); sel = null; return; }
          if (sel && sel.side !== side) {
            if (sel.id === id) {
              sel.el.classList.remove('sel'); sel.el.classList.add('done'); chip.classList.add('done');
              sel = null; matched++; doneTotal++;
              $('.prog i').style.width = (doneTotal / total * 100) + '%';
              if (matched === round.length) setTimeout(function(){ r++; draw(); }, 500);
            } else {
              slips++;
              var other = sel.el; other.classList.remove('sel'); sel = null;
              other.classList.add('slip'); chip.classList.add('slip');
              setTimeout(function(){ other.classList.remove('slip'); chip.classList.remove('slip'); }, 420);
              $('.count').textContent = label();
            }
            return;
          }
          if (sel) sel.el.classList.remove('sel');
          chip.classList.add('sel'); sel = {el: chip, side: side, id: id};
        };
      });
    }
    draw();
    window.scrollTo(0, 0);
  }

  renderSide();
  loadKeys().then(function(){ library(); checkShared(); }, function(){ library(); checkShared(); });
  if (IS_PWA && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  if (IS_PWA && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
})();

</script>
